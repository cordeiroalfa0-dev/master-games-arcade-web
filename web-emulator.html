<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Games Arcade — Web Emulator Test</title>
  <style>
    :root{--neon:#00e5ff;--pink:#ff2bd6;--gold:#ffd54f}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#dff8ff;font-family:Segoe UI,system-ui,sans-serif}
    body{background-image:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.78)),url('/assets/background.png');background-size:cover;background-position:center;overflow:hidden}
    .wrap{height:100%;display:grid;grid-template-rows:auto 1fr;padding:18px;gap:12px;background:rgba(0,0,0,.22)}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid rgba(0,229,255,.45);border-radius:10px;background:rgba(6,10,22,.84);box-shadow:0 0 18px rgba(0,229,255,.22)}
    h1{margin:0;color:var(--neon);font-size:18px;letter-spacing:2px}p{margin:5px 0 0;color:#9fdcff;font-size:12px}
    .controls{display:flex;gap:8px;align-items:center}.btn{background:#0b1a30;color:var(--neon);border:1px solid rgba(0,229,255,.45);border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:700}.btn:hover{box-shadow:0 0 12px rgba(0,229,255,.4)}
    input{display:none}.status{font-size:11px;color:var(--gold);max-width:360px;text-align:right}
    #game{min-height:0;width:100%;height:100%;border:1px solid rgba(0,229,255,.35);border-radius:10px;background:#000;overflow:hidden;box-shadow:0 0 24px rgba(0,229,255,.16)}
    .note{position:absolute;left:28px;bottom:24px;color:#8fc9e6;font-size:11px;background:rgba(0,0,0,.72);padding:7px 10px;border-radius:6px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>MASTER GAMES ARCADE</h1><p>Teste do MAME Plus! 0.168.2 standalone via WebAssembly — sem RetroArch</p></div>
    <div class="controls"><label class="btn" for="rom">ABRIR ROM</label><input id="rom" type="file" accept=".zip,.7z,.chd,.rom,.bin"><span id="status" class="status">Selecione uma ROM local para iniciar o teste.</span></div>
  </header>
  <div id="game"></div>
</div>
<div class="note">Controles preservados como referência: setas · Z/X/C/A/S/D · 1 START · 5 COIN · TAB MENU</div>
<script>
const input=document.getElementById('rom');
const status=document.getElementById('status');
input.addEventListener('change',()=>{
  const file=input.files?.[0];
  if(!file)return;
  window.Module={arguments:[file.name.replace(/\.[^.]+$/,''),'-rompath','/roms','-window','-video','soft'],preRun:[],canvas:document.getElementById('game'),print:text=>console.log(text),printErr:text=>console.error(text),setStatus:text=>{if(text)status.textContent=text}};
  Module.preRun.push(()=>{Module.addRunDependency('rom');try{FS.mkdir('/roms')}catch{};file.arrayBuffer().then(data=>FS.writeFile('/roms/'+file.name,new Uint8Array(data))).finally(()=>Module.removeRunDependency('rom'));});
  status.textContent='Carregando '+file.name+' no MAME Plus! 0.168.2...';
  const s=document.createElement('script');
  s.src='/web/mame0168/mame.js';
  s.onload=()=>status.textContent='MAME carregado. Aguarde o jogo iniciar.';
  s.onerror=()=>status.textContent='Build standalone do MAME indisponível.';
  document.body.appendChild(s);
});
</script>
</body>
</html>
