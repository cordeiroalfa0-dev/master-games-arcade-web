<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Games Arcade - Player</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #game { width:100vw; height:100vh; min-width:100%; min-height:100%; background:#000; }
    #status { position:fixed; inset:0; z-index:99999; display:grid; place-items:center; background:#000; color:#00e5ff; font:700 16px monospace; text-align:center; padding:24px; box-sizing:border-box; white-space:pre-wrap; }
    #debug { position:fixed; left:10px; right:10px; bottom:10px; z-index:100000; max-height:42vh; overflow:auto; display:none; background:rgba(0,0,0,.88); border:1px solid #00e5ff; color:#00e5ff; padding:10px; box-sizing:border-box; font:12px/1.35 monospace; white-space:pre-wrap; pointer-events:none; }
  </style>
</head>
<body>
    <div id="game"></div>
  <div id="status">BAIXANDO ROM...</div>
  <pre id="debug"></pre>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const romUrl = params.get("rom");
      const parentUrl = params.get("parent") || "";
      const gameName = params.get("name") || "Master Games Arcade";
      const cleanName = gameName.replace(/\.(zip|7z|chd)$/i, "");
      const status = document.getElementById("status");
      const debug = document.getElementById("debug");

      const diagnostic = [];
      const log = (text) => {
        const line = `[${new Date().toLocaleTimeString()}] ${text}`;
        diagnostic.push(line);
        if (diagnostic.length > 80) diagnostic.shift();
        debug.textContent = diagnostic.join("\n");
        console.log("[MGA]", text);
      };

      const fail = (text) => {
        status.textContent = text;
        status.style.color = "#ff2bd6";
        debug.style.display = "block";
        log(`ERRO: ${text}`);
      };

      window.addEventListener("error", (event) => {
        log(`window.error: ${event.message || "erro desconhecido"}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        log(`unhandledrejection: ${event.reason?.message || String(event.reason)}`);
      });

      if (!romUrl) {
        fail("ROM NÃO INFORMADA");
        return;
      }

      const absoluteRomUrl = new URL(romUrl, location.origin).href;
      log(`Jogo: ${cleanName}`);
      log(`ROM: ${absoluteRomUrl}`);

      (async () => {
        try {
          status.textContent = `BAIXANDO ${gameName}...`;

          const response = await fetch(absoluteRomUrl, {
            method: "GET",
            cache: "no-store",
            credentials: "same-origin"
          });

          if (!response.ok) {
            throw new Error(`Servidor da ROM respondeu HTTP ${response.status}`);
          }

          const contentType = (response.headers.get("content-type") || "").toLowerCase();
          const contentLength = response.headers.get("content-length") || "desconhecido";
          const bytes = new Uint8Array(await response.arrayBuffer());

          log(`Download: ${bytes.length} bytes; Content-Type: ${contentType || "desconhecido"}; Header: ${contentLength}`);

          if (!bytes.length) {
            throw new Error("A ROM veio vazia.");
          }

          const isZip = bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b &&
            ((bytes[2] === 0x03 && bytes[3] === 0x04) ||
             (bytes[2] === 0x05 && bytes[3] === 0x06) ||
             (bytes[2] === 0x07 && bytes[3] === 0x08));
          const is7z = bytes.length >= 6 && bytes[0] === 0x37 && bytes[1] === 0x7a &&
            bytes[2] === 0xbc && bytes[3] === 0xaf && bytes[4] === 0x27 && bytes[5] === 0x1c;
          const isChd = bytes.length >= 8 && new TextDecoder().decode(bytes.slice(0, 8)) === "MComprHD";

          log(`Formato detectado: ${isZip ? "ZIP" : is7z ? "7Z" : isChd ? "CHD" : "desconhecido"}`);

          if (!(isZip || is7z || isChd)) {
            const looksHtml = contentType.includes("text/html") ||
              new TextDecoder().decode(bytes.slice(0, Math.min(bytes.length, 120))).toLowerCase().includes("<!doctype");
            throw new Error(looksHtml
              ? "O Google Drive devolveu uma página HTML em vez da ROM."
              : "O arquivo recebido não é uma ROM ZIP/7Z/CHD válida.");
          }

          status.textContent = `INICIANDO ${cleanName}...`;

          // MAME Plus! 0.168.2 standalone: sem EmulatorJS e sem RetroArch.
          // O workflow publica o glue Emscripten em /web/mame0168/mame.js.
          const romFileName = gameName || `${cleanName}.zip`;
          const standaloneCanvas = document.createElement("canvas");
          standaloneCanvas.tabIndex = 0;
          standaloneCanvas.style.cssText = "width:100%;height:100%;display:block;";
          document.getElementById("game").appendChild(standaloneCanvas);
          window.Module = {
            arguments: [cleanName, "-rompath", "/roms", "-window", "-video", "soft"],
            preRun: [],
            canvas: standaloneCanvas,
            print: (text) => log(String(text)),
            printErr: (text) => log(`ERRO MAME: ${text}`),
            setStatus: (text) => { if (text) status.textContent = String(text); }
          };
          Module.preRun.push(() => {
            Module.addRunDependency("mga-rom");
            try { FS.mkdir("/roms"); } catch {}
            try {
              FS.writeFile(`/roms/${romFileName}`, bytes);
              log(`ROM montada em /roms/${romFileName}`);
            } catch (error) {
              fail(error?.message || "Falha ao montar a ROM");
            } finally {
              Module.removeRunDependency("mga-rom");
            }
          });

          const numpadMap = {
            Numpad8: "i",
            Numpad2: "k",
            Numpad4: "j",
            Numpad6: "l"
          };

          const dispatchKey = (key, type) => {
            const target = document.querySelector("canvas") || document;
            const event = new KeyboardEvent(type, {
              key,
              code: key.length === 1 ? `Key${key.toUpperCase()}` : key,
              bubbles: true,
              cancelable: true,
              composed: true
            });
            target.dispatchEvent(event);
          };

          window.addEventListener("keydown", (event) => {
            const mapped = numpadMap[event.code];
            if (!mapped) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            dispatchKey(mapped, "keydown");
          }, true);

          window.addEventListener("keyup", (event) => {
            const mapped = numpadMap[event.code];
            if (!mapped) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            dispatchKey(mapped, "keyup");
          }, true);

          const gamepadState = new Map();
          const gamepadKeys = [
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"],
            ["i", "k", "j", "l"]
          ];

          const updateArcadeDirections = () => {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let player = 0; player < 2; player++) {
              const pad = pads[player];
              if (!pad) continue;

              const x = Number(pad.axes?.[0] || 0);
              const y = Number(pad.axes?.[1] || 0);
              const threshold = 0.35;
              const wanted = {
                [gamepadKeys[player][0]]: y < -threshold,
                [gamepadKeys[player][1]]: y > threshold,
                [gamepadKeys[player][2]]: x < -threshold,
                [gamepadKeys[player][3]]: x > threshold
              };

              let state = gamepadState.get(player);
              if (!state) {
                state = {};
                gamepadState.set(player, state);
              }

              for (const [key, pressed] of Object.entries(wanted)) {
                if (pressed === !!state[key]) continue;
                state[key] = pressed;
                dispatchKey(key, pressed ? "keydown" : "keyup");
              }
            }
            requestAnimationFrame(updateArcadeDirections);
          };
          requestAnimationFrame(updateArcadeDirections);

          const pressArcadeKey = (key, code, keyCode) => {
            const target = document.querySelector("canvas") || document;
            target.focus?.();
            const event = new KeyboardEvent("keydown", {
              key, code, bubbles: true, cancelable: true,
              composed: true, keyCode, which: keyCode
            });
            for (const prop of ["keyCode", "which"]) {
              try { Object.defineProperty(event, prop, { value: keyCode }); } catch {}
            }
            target.dispatchEvent(event);
            setTimeout(() => target.dispatchEvent(new KeyboardEvent("keyup", {
              key, code, bubbles: true, cancelable: true,
              composed: true, keyCode, which: keyCode
            })), 100);
          };

          const script = document.createElement("script");
          script.src = "/web/mame0168/mame.js";
          script.async = true;
          script.onerror = () => fail("MAME Plus! 0.168.2 standalone ainda não publicado");
          document.head.appendChild(script);
        } catch (error) {
          fail(error?.message || "FALHA AO CARREGAR A ROM");
          try { window.parent.postMessage({ type: "mga-emulator-error", message: error?.message || "Falha ao carregar a ROM." }, location.origin); } catch {}
        }
      })();
    })();
  </script>
</body>
</html>
