<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Games Arcade - Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #game{width:100vw;height:100vh;background:#000}
    #status{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#000;color:#00e5ff;font:700 16px monospace;text-align:center;padding:24px;box-sizing:border-box;white-space:pre-wrap;pointer-events:none}
    #debug{position:fixed;left:10px;right:10px;bottom:10px;z-index:100000;max-height:42vh;overflow:auto;display:none;background:rgba(0,0,0,.9);border:1px solid #00e5ff;color:#00e5ff;padding:10px;box-sizing:border-box;font:12px/1.35 monospace;white-space:pre-wrap}
    #manual-start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100001;display:none;background:#08000f;color:#00e5ff;border:2px solid #00e5ff;box-shadow:0 0 18px #00e5ff66;padding:16px 24px;font:700 16px monospace;cursor:pointer}
    #mga-touch-controls{display:none}
    @media (pointer:coarse){
      #mga-touch-controls{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:100003;display:grid;grid-template-columns:repeat(3,52px);grid-auto-rows:48px;gap:6px;font:700 11px monospace;touch-action:none}
      #mga-touch-controls button{border:1px solid #00e5ff;border-radius:9px;background:rgba(8,0,15,.88);box-shadow:0 0 10px #00e5ff55;color:#00e5ff;font:inherit;padding:0;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
      #mga-touch-controls button:active{background:#00e5ff;color:#08000f}
      #mga-touch-controls .empty{visibility:hidden}
      #mga-touch-controls .action{color:#ff2bd6;border-color:#ff2bd6;box-shadow:0 0 10px #ff2bd655}
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status">CARREGANDO...</div>
  <pre id="debug"></pre>
  <button id="manual-start" type="button">▶ CLIQUE PARA INICIAR</button>
  <div id="mga-touch-controls" aria-label="Controles do jogo">
    <span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span>
    <button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
    <button class="action" data-key="Shift">CRÉDITO</button><button class="action" data-key="Enter">START</button>
  </div>

<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const rom=q.get('rom');
  const biosUrl=q.get('bios')||'';
  const biosName=q.get('biosName')||'';
  const name=q.get('name')||'Master Games Arcade';
  const status=document.getElementById('status');
  const debug=document.getElementById('debug');
  const manual=document.getElementById('manual-start');
  const touchControls=document.getElementById('mga-touch-controls');
  const logs=[];

  let ready=false;
  let started=false;
  let attempting=false;
  let retriesLeft=3;
  let retryTimer=null;
  let startWatchdog=null;

  const log=x=>{
    logs.push(`[${new Date().toLocaleTimeString()}] ${x}`);
    if(logs.length>80)logs.shift();
    debug.textContent=logs.join('\n');
    console.log('[MGA]',x);
  };

  const fail=x=>{
    status.textContent=x;
    status.style.color='#ff2bd6';
    debug.style.display='block';
    manual.style.display='none';
    log('ERRO: '+x);
    try{parent.postMessage({type:'mga-emulator-error',message:x},location.origin)}catch{}
  };

  if(!rom){
    fail('ROM NÃO INFORMADA');
    return;
  }

  const romUrl=new URL(rom,location.origin).href;
  log('Jogo: '+name);
  log('ROM URL: '+romUrl);
  if(biosUrl){
    log('BIOS: '+(biosName||'dependência')+' — '+new URL(biosUrl,location.origin).href);
  }

  // EmulatorJS Arcade utiliza o core FBNeo nesta configuração.
  // A ROM ZIP deve ser compatível com o romset FBNeo.
  window.EJS_biosUrl=biosUrl?new URL(biosUrl,location.origin).href:'';
  window.EJS_gameParentUrl='';
  window.EJS_externalFiles={};

  const enterFullscreen=()=>{
    try{
      if(document.fullscreenElement)return;
      const el=document.documentElement;
      const request=el.requestFullscreen||el.webkitRequestFullscreen;
      if(request){const result=request.call(el,{navigationUI:'hide'});if(result?.catch)result.catch(()=>{});}
    }catch{}
  };
  addEventListener('pointerdown',enterFullscreen,{capture:true,once:true,passive:true});
  addEventListener('touchstart',enterFullscreen,{capture:true,once:true,passive:true});

  if(matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0){
    const specs={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Shift:16,Enter:13};
    const emit=(type,name)=>{
      const target=document.querySelector('canvas')||document;
      target.dispatchEvent(new KeyboardEvent(type,{key:name,code:name,keyCode:specs[name],which:specs[name],bubbles:true,cancelable:true,composed:true}));
    };
    touchControls.querySelectorAll('button[data-key]').forEach(button=>{
      const name=button.dataset.key;
      const release=event=>{event.preventDefault();emit('keyup',name);};
      button.addEventListener('pointerdown',event=>{event.preventDefault();event.stopPropagation();emit('keydown',name);},{passive:false});
      button.addEventListener('pointerup',release,{passive:false});
      button.addEventListener('pointercancel',release,{passive:false});
      button.addEventListener('contextmenu',event=>event.preventDefault());
    });
  }

  // Mantém o ZIP da BIOS intacto para o core fazer o merge com o romset.
  window.EJS_dontExtractBIOS=true;

  if(biosUrl){
    log('BIOS configurado via EJS_biosUrl: '+(biosName||biosUrl));
    // Diagnóstico em segundo plano: nunca bloquear o loader aguardando HEAD.
    // Em celulares, proxies/CDNs podem deixar essa requisição pendente mesmo
    // quando o download GET da BIOS funciona normalmente.
    fetch(window.EJS_biosUrl,{method:'HEAD'})
      .then(head=>log('Checagem HEAD da BIOS: status '+head.status+', tamanho '+(head.headers.get('content-length')||'desconhecido')+' bytes'))
      .catch(e=>log('Checagem HEAD da BIOS falhou: '+(e?.message||e)+' (ignorado)'));
  }

  status.textContent='INICIANDO Arcade (FBNeo) — '+name+'...';

  window.EJS_player='#game';
  window.EJS_core='arcade';
  window.EJS_gameName=name.replace(/\.(zip|7z|chd)$/i,'');
  window.EJS_gameUrl=romUrl;

  // Versão fixada para evitar alterações automáticas no core.
  const EJS_PINNED_VERSION='4.2.3';
  window.EJS_pathtodata='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/';
  // Desativado: o EmulatorJS cria o próprio botão Start Game. Se o player
  // clicar automaticamente nele ao mesmo tempo que o EmulatorJS inicializa
  // o módulo WASM, ocorre o erro "toggleMainLoop undefined".
  window.EJS_startOnLoaded=false;
  window.EJS_alignStartButton='center';
  window.EJS_language='en-US';
  window.EJS_disableAutoLang=true;
  window.EJS_volume=0;
  window.EJS_color='#00e5ff';
  window.EJS_backgroundColor='#000';
  window.EJS_DEBUG_XX=true;

  const hide=()=>{
    status.style.display='none';
    manual.style.display='none';
  };

  window.EJS_onGameStart=()=>{
    if(started)return;
    started=true;
    attempting=false;
    if(retryTimer)clearTimeout(retryTimer);
    if(startWatchdog)clearTimeout(startWatchdog);
    hide();
    log('Arcade/FBNeo iniciou o jogo');

    try{
      const fs=window.EJS_emulator?.gameManager?.FS;
      if(fs){
        const expected=biosName||'BIOS';
        const checks=[
          `/${expected}`,
          '/home/web_user/retroarch/userdata/system/'+expected,
          '/home/web_user/retroarch/userdata/system/fbneo/'+expected
        ];
        const found=checks.filter(p=>{
          try{fs.stat(p);return true}catch{return false}
        });
        log(expected+' encontrado no FS: '+(found.length?found.join(' | '):'não exposto pelo wrapper'));
      }
    }catch(e){
      log('Diagnóstico FS: '+(e?.message||e));
    }

    try{parent.postMessage({type:'mga-emulator-started'},location.origin)}catch{}
  };

  window.EJS_ready=()=>{
    ready=true;
    status.style.display='none';
    manual.style.display='none';
    log('EmulatorJS pronto; iniciando o core Arcade...');

    // Em alguns celulares o clique no botão visual não chega ao método
    // interno do EmulatorJS e a tela fica preta. EJS_ready já indica que o
    // módulo está pronto; aguardamos um ciclo para evitar a corrida
    // "toggleMainLoop undefined" e chamamos a API oficial uma única vez.
    setTimeout(()=>{
      if(started||attempting)return;
      const emulator=window.EJS_emulator;
      if(!emulator?.startGame){
        log('API startGame ainda não disponível; aguardando o botão nativo.');
        return;
      }
      attempting=true;
      try{
        emulator.startGame();
        log('startGame() acionado pelo player');
      }catch(e){
        attempting=false;
        log('Falha ao iniciar o core: '+(e?.message||e));
      }
    },1200);
  };

  addEventListener('error',e=>{
    log('window.error: '+(e.message||'erro mascarado pelo CDN'));
  });

  addEventListener('unhandledrejection',e=>{
    log('unhandledrejection: '+(e.reason?.message||e.reason));
  });

  startWatchdog=setTimeout(()=>{
    if(!ready&&!started){
      fail('Arcade não carregou em 30s. Verifique a ROM, o BIOS e o endpoint de download.');
    }
  },30000);

  setTimeout(()=>{
    if(ready&&!started){
      fail('EmulatorJS ficou pronto, mas o core Arcade (FBNeo) não iniciou a ROM. Confirme o romset e o BIOS.');
    }
  },45000);

  const map={Numpad8:'i',Numpad2:'k',Numpad4:'j',Numpad6:'l'};
  const key=(k,type)=>{
    const t=document.querySelector('canvas')||document;
    t.dispatchEvent(new KeyboardEvent(type,{
      key:k,
      code:k.length===1?'Key'+k.toUpperCase():k,
      bubbles:true,
      cancelable:true,
      composed:true
    }));
  };

  addEventListener('keydown',e=>{
    if(map[e.code]){
      e.preventDefault();
      e.stopImmediatePropagation();
      key(map[e.code],'keydown');
    }
  },true);

  addEventListener('keyup',e=>{
    if(map[e.code]){
      e.preventDefault();
      e.stopImmediatePropagation();
      key(map[e.code],'keyup');
    }
  },true);

  const pads=new Map();
  const pkeys=[['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],['i','k','j','l']];
  const poll=()=>{
    const gs=navigator.getGamepads?navigator.getGamepads():[];
    for(let p=0;p<2;p++){
      const g=gs[p];
      if(!g)continue;
      const x=+(g.axes?.[0]||0),y=+(g.axes?.[1]||0),s=pads.get(p)||{};
      const w={
        [pkeys[p][0]]:y<-.35,
        [pkeys[p][1]]:y>.35,
        [pkeys[p][2]]:x<-.35,
        [pkeys[p][3]]:x>.35
      };
      for(const [k,v] of Object.entries(w)){
        if(v===!!s[k])continue;
        s[k]=v;
        key(k,v?'keydown':'keyup');
      }
      pads.set(p,s);
    }
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);

  const script=document.createElement('script');
  script.src='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/loader.js';
  script.async=true;
  script.crossOrigin='anonymous';
  script.onerror=()=>fail('Não foi possível carregar o EmulatorJS pelo CDN.');
  document.head.appendChild(script);
})();
</script>
</body>
</html>
