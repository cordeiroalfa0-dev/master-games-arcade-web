
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Games Arcade - Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #game{width:100vw;height:100vh;background:#000}
    #status{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#000;color:#00e5ff;font:700 16px monospace;text-align:center;padding:24px;box-sizing:border-box;white-space:pre-wrap;pointer-events:none}
    #debug{position:fixed;left:10px;right:10px;bottom:10px;z-index:100000;max-height:42vh;overflow:auto;display:none;background:rgba(0,0,0,.9);border:1px solid #00e5ff;color:#00e5ff;padding:10px;box-sizing:border-box;font:12px/1.35 monospace;white-space:pre-wrap}
    #manual-start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100001;display:none;background:#08000f;color:#00e5ff;border:2px solid #00e5ff;box-shadow:0 0 18px #00e5ff66;padding:16px 24px;font:700 16px monospace;cursor:pointer}
  </style>
</head>
<body>
<div id="game"></div><div id="status">CARREGANDO...</div><pre id="debug"></pre><button id="manual-start" type="button">▶ CLIQUE PARA INICIAR</button>
<script>
(async()=>{
 const q=new URLSearchParams(location.search),rom=q.get('rom'),biosUrl=q.get('bios')||'',biosName=q.get('biosName')||'',name=q.get('name')||'Master Games Arcade';
 const status=document.getElementById('status'),debug=document.getElementById('debug'),manual=document.getElementById('manual-start'),logs=[];
 const log=x=>{logs.push(`[${new Date().toLocaleTimeString()}] ${x}`);if(logs.length>80)logs.shift();debug.textContent=logs.join('\n');console.log('[MGA]',x)};
 const fail=x=>{status.textContent=x;status.style.color='#ff2bd6';debug.style.display='block';manual.style.display='none';log('ERRO: '+x);try{parent.postMessage({type:'mga-emulator-error',message:x},location.origin)}catch{}};
 addEventListener('error',e=>log('window.error: '+(e.message||'erro')));
 addEventListener('unhandledrejection',e=>log('unhandledrejection: '+(e.reason?.message||e.reason)));
 if(!rom){fail('ROM NÃO INFORMADA');return}
 const romUrl=new URL(rom,location.origin).href;
 log('Jogo: '+name);log('ROM URL: '+romUrl);if(biosUrl)log('BIOS: '+(biosName||'dependência')+' — '+new URL(biosUrl,location.origin).href);

 // O player web usa diretamente o core Arcade do EmulatorJS.
 // O build MAME standalone não faz parte deste repositório; não interrompa
 // a inicialização procurando /web/mame0168/mame.js.
 // IMPORTANTE (corrigido em 2026-09-13): EJS_core='arcade' hoje roda sobre
 // o core FBNeo (libretro), não sobre o FBA 0.2.97.42 antigo — a doc oficial
 // do EmulatorJS confirma isso (https://emulatorjs.org/docs/systems/arcade/).
 // Romsets e BIOS precisam bater com o que ESSA build do FBNeo espera, não
 // com dumps antigos de MAME 0.168.2 sem verificar. A BIOS é entregue via
 // EJS_biosUrl e precisa ter os nomes internos exatos (ex: sp-s3.sp1) que o
 // core procura, não só o CRC correto.
 window.EJS_biosUrl=biosUrl?new URL(biosUrl,location.origin).href:'';
 window.EJS_gameParentUrl='';
 window.EJS_externalFiles={};
 window.EJS_dontExtractBIOS=false;
 if(biosUrl){
   log('BIOS configurado via EJS_biosUrl: '+(biosName||biosUrl));
   // Confere se o arquivo de BIOS realmente responde (200 + tamanho) antes
   // do EmulatorJS tentar buscá-lo. Isso separa "endpoint quebrado/CORS"
   // de "o core não expôs o arquivo no FS depois de baixar certo".
   try{
     const head=await fetch(window.EJS_biosUrl,{method:'HEAD'});
     const len=head.headers.get('content-length');
     log('Checagem HEAD da BIOS: status '+head.status+', tamanho '+(len||'desconhecido')+' bytes');
     if(!head.ok) log('AVISO: endpoint da BIOS não respondeu OK — o core vai falhar ao montar o arquivo.');
   }catch(e){log('Checagem HEAD da BIOS falhou: '+(e?.message||e)+' (pode ser CORS ou rede)')}
 }

 // A URL da ROM é entregue diretamente ao EmulatorJS. Não fazemos um
 // ArrayBuffer/Blob da ROM antes do player para evitar download duplicado.
 status.textContent='INICIANDO Arcade/FBA 0.2.97.42 — '+name+'...';
 window.EJS_player='#game';
   // O catálogo informa ROMs do set FBA 0.2.97.42. Não misture com
   // conjuntos de MAME 0.168, MAME moderno ou FBNeo.
 window.EJS_core='arcade';
 window.EJS_gameName=name.replace(/\.(zip|7z|chd)$/i,'');
   window.EJS_gameUrl=romUrl;
 // Fixado em uma versão numerada (em vez de 'stable') para que o core e o
 // formato de romset esperado não mudem sozinhos por trás do projeto.
 // Atualize este número apenas quando testar a mudança manualmente.
 const EJS_PINNED_VERSION='4.2.3';
 window.EJS_pathtodata='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/';
 window.EJS_startOnLoaded=true;
 window.EJS_alignStartButton='center';
 window.EJS_language='en-US';
 window.EJS_disableAutoLang=true;
 window.EJS_volume=0;
 window.EJS_color='#00e5ff';
 window.EJS_backgroundColor='#000';
 window.EJS_DEBUG_XX=true;

 let ready=false,started=false;
 const hide=()=>{status.style.display='none';manual.style.display='none'};
 window.EJS_onGameStart=()=>{
   if(started)return;
   started=true;hide();log('Arcade/FBA iniciou o jogo');
   try{
     const fs=window.EJS_emulator?.gameManager?.FS;
     if(fs){
       const expected=biosName||'BIOS';
       const checks=[`/${expected}`,'/home/web_user/retroarch/userdata/system/'+expected,'/home/web_user/retroarch/userdata/system/fbneo/'+expected];
       const found=checks.filter(p=>{try{fs.stat(p);return true}catch{return false}});
       log(expected+' encontrado no FS: '+(found.length?found.join(' | '):'não exposto pelo wrapper'));
     }
   }catch(e){log('Diagnóstico FS: '+(e?.message||e))}
   try{parent.postMessage({type:'mga-emulator-started'},location.origin)}catch{}
 };

 const tryStart=()=>{
   const els=[...document.querySelectorAll('button,[role="button"]')];
   log('Botões disponíveis: '+els.map(e=>(e.textContent||'').trim()).filter(Boolean).join(' | '));
   const b=els.find(e=>/^\s*(start game|start|play)\s*$/i.test((e.textContent||'').trim()));
   if(b){b.click();log('Start Game acionado');return true}return false;
 };
 const showManualStart=()=>{if(!started){status.style.display='none';manual.style.display='block';log('Aguardando clique do usuário para iniciar o Arcade/FBA')}};
 manual.addEventListener('click',()=>{manual.style.display='none';if(!tryStart())log('Nenhum botão Start Game encontrado após clique')});
 document.addEventListener('click',()=>{if(ready&&!started)tryStart()},true);
 window.EJS_ready=()=>{ready=true;log('EmulatorJS pronto');if(!tryStart()){
   showManualStart();
   const t=setInterval(()=>{if(started||tryStart()){clearInterval(t);manual.style.display='none'}},1000);
   setTimeout(()=>clearInterval(t),45000);
 }};
 setTimeout(()=>{if(!ready&&!started)fail('Arcade não carregou em 30s. Verifique a ROM/BIOS e o endpoint de download.')},30000);
 setTimeout(()=>{if(ready&&!started)fail('EmulatorJS ficou pronto, mas o core Arcade não iniciou a ROM. Confirme o FBA 0.2.97.42 e o nome correto da BIOS.')},45000);

 const map={Numpad8:'i',Numpad2:'k',Numpad4:'j',Numpad6:'l'};
 const key=(k,type)=>{const t=document.querySelector('canvas')||document;t.dispatchEvent(new KeyboardEvent(type,{key:k,code:k.length===1?'Key'+k.toUpperCase():k,bubbles:true,cancelable:true,composed:true}))};
 addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();e.stopImmediatePropagation();key(map[e.code],'keydown')}},true);
 addEventListener('keyup',e=>{if(map[e.code]){e.preventDefault();e.stopImmediatePropagation();key(map[e.code],'keyup')}},true);
 const pads=new Map(),pkeys=[['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],['i','k','j','l']];
 const poll=()=>{const gs=navigator.getGamepads?navigator.getGamepads():[];for(let p=0;p<2;p++){const g=gs[p];if(!g)continue;const x=+(g.axes?.[0]||0),y=+(g.axes?.[1]||0),s=pads.get(p)||{},w={[pkeys[p][0]]:y<-.35,[pkeys[p][1]]:y>.35,[pkeys[p][2]]:x<-.35,[pkeys[p][3]]:x>.35};for(const [k,v]of Object.entries(w)){if(v===!!s[k])continue;s[k]=v;key(k,v?'keydown':'keyup')}pads.set(p,s)}requestAnimationFrame(poll)};requestAnimationFrame(poll);
 const script=document.createElement('script');script.src='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/loader.js';script.async=true;script.onerror=()=>fail('Não foi possível carregar o EmulatorJS pelo CDN.');document.head.appendChild(script);
})();
</script>
</body>
</html>
