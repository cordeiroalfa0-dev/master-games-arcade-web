<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Master Games Arcade - Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #game{position:relative;width:100vw;height:100vh;background:#000;display:grid;place-items:center;overflow:hidden;--video-brightness:1;--video-contrast:1;--video-saturation:1}
    /* Tira os elementos do EmulatorJS do fluxo: senão o canvas cresce a cada
       medição do ResizeObserver e a tela fica preta. */
    #game>*{position:absolute;top:0;left:0;width:100%;height:100%;max-width:100vw;max-height:100vh}
    #game canvas,#game video{max-width:100vw!important;max-height:100vh!important;object-fit:contain}
    #game canvas,#game video{image-rendering:pixelated;image-rendering:crisp-edges;filter:brightness(var(--video-brightness)) contrast(var(--video-contrast)) saturate(var(--video-saturation));}
    body.video-aspect-43 #game canvas,body.video-aspect-43 #game video{width:min(100vw,133.333vh)!important;height:min(75vw,100vh)!important;object-fit:contain}
    /* Preenche a viewport inteira. Em telas widescreen o arcade 4:3 é
       esticado horizontalmente para eliminar as margens pretas laterais. */
    body.video-stretch #game .ejs_canvas_parent,body.video-stretch #game canvas,body.video-stretch #game video{position:absolute!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;object-fit:fill!important}
    body.video-integer #game canvas,body.video-integer #game video{image-rendering:pixelated;transform:translateZ(0)}
    body.video-scanlines #game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:99998;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,.16) 4px);mix-blend-mode:multiply}
    body.video-vignette #game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:99997;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42) 100%)}
    body.video-amber #game canvas,body.video-amber #game video{filter:brightness(var(--video-brightness)) contrast(calc(var(--video-contrast) * 1.08)) saturate(calc(var(--video-saturation) * .82)) sepia(.16)}
    body.video-cool #game canvas,body.video-cool #game video{filter:brightness(var(--video-brightness)) contrast(var(--video-contrast)) saturate(calc(var(--video-saturation) * 1.12)) hue-rotate(8deg)}
    body.video-soft #game canvas,body.video-soft #game video{image-rendering:auto;filter:brightness(var(--video-brightness)) contrast(.96) saturate(var(--video-saturation));}
    @media (min-resolution:2dppx){#game canvas,#game video{image-rendering:pixelated}}
    @media (orientation:portrait){body.video-auto #game canvas,body.video-auto #game video{max-width:100vw;max-height:75vh;object-fit:contain}}
    /* O launcher mostra apenas o jogo, não a interface do emulador. */
    #game button,#game [role="button"],#game .ejs_menu_bar,#game .ejs_menu,
    #game .ejs_context_menu,#game .ejs_volume_parent,#game [class*="ejs-menu"],
    #game [class*="ejs_context"],#game [class*="ejs-start"]{
      display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important
    }
    #status{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#000;color:#00e5ff;font:700 16px monospace;text-align:center;padding:24px;box-sizing:border-box;white-space:pre-wrap;pointer-events:none}
    #debug{position:fixed;left:10px;right:10px;bottom:10px;z-index:100000;max-height:42vh;overflow:auto;display:none;background:rgba(0,0,0,.9);border:1px solid #00e5ff;color:#00e5ff;padding:10px;box-sizing:border-box;font:12px/1.35 monospace;white-space:pre-wrap}
    #manual-start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100001;display:none;background:#08000f;color:#00e5ff;border:2px solid #00e5ff;box-shadow:0 0 18px #00e5ff66;padding:16px 24px;font:700 16px monospace;cursor:pointer}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status">CARREGANDO...</div>
  <pre id="debug"></pre>
  <button id="manual-start" type="button">▶ CLIQUE PARA INICIAR</button>

<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const rom=q.get('rom');
  const biosUrl=q.get('bios')||'';
  const biosName=q.get('biosName')||'';
  const name=q.get('name')||'Master Games Arcade';
  const status=document.getElementById('status');
  const debug=document.getElementById('debug');
  const manual=document.getElementById('manual-start');
  const logs=[];

  let ready=false;
  let started=false;
  let attempting=false;
  let retriesLeft=3;
  let retryTimer=null;
  let startWatchdog=null;

  const log=x=>{
    logs.push(`[${new Date().toLocaleTimeString()}] ${x}`);
    if(logs.length>80)logs.shift();
    debug.textContent=logs.join('\n');
    console.log('[MGA]',x);
  };

  const VISUAL_KEY='mga-video-profile-v1';
  const visualDefaults={aspect:'stretch',integer:true,scanlines:false,vignette:true,palette:'normal',brightness:1,contrast:1,saturation:1};
  let visual={...visualDefaults};
  try{visual={...visual, ...JSON.parse(localStorage.getItem(VISUAL_KEY)||'{}')}}catch{}
  // Perfis antigos usavam "auto" (contain), que deixava barras laterais.
  // Migra somente esse modo; preferências explícitas 4:3/stretch continuam.
  if(visual.aspect==='auto')visual.aspect='stretch';
  const applyVisual=()=>{
    document.body.classList.toggle('video-auto',visual.aspect==='auto');
    document.body.classList.toggle('video-aspect-43',visual.aspect==='4:3');
    document.body.classList.toggle('video-stretch',visual.aspect==='stretch');
    document.body.classList.toggle('video-integer',!!visual.integer);
    document.body.classList.toggle('video-scanlines',!!visual.scanlines);
    document.body.classList.toggle('video-vignette',!!visual.vignette);
    document.body.classList.toggle('video-amber',visual.palette==='amber');
    document.body.classList.toggle('video-cool',visual.palette==='cool');
    document.body.classList.toggle('video-soft',visual.palette==='soft');
    document.getElementById('game')?.style.setProperty('--video-brightness',visual.brightness);
    document.getElementById('game')?.style.setProperty('--video-contrast',visual.contrast);
    document.getElementById('game')?.style.setProperty('--video-saturation',visual.saturation);
    try{localStorage.setItem(VISUAL_KEY,JSON.stringify(visual))}catch{}
  };
  const cycleVisual=()=>{
    visual.aspect=visual.aspect==='auto'?'4:3':visual.aspect==='4:3'?'stretch':'auto';
    applyVisual();log('Proporção: '+visual.aspect);
  };
  const visualHelp=()=>log('Vídeo: F2 scanlines | F3 escala inteira | F4 proporção | F5 paleta | F6 brilho | F7 contraste | F8 saturação | F10 vinheta');
  applyVisual();

  const fail=x=>{
    status.textContent=x;
    status.style.color='#ff2bd6';
    debug.style.display='block';
    manual.style.display='none';
    log('ERRO: '+x);
    try{parent.postMessage({type:'mga-emulator-error',message:x},location.origin)}catch{}
  };

  if(!rom){
    fail('ROM NÃO INFORMADA');
    return;
  }

  const romUrl=new URL(rom,location.origin).href;
  log('Jogo: '+name);
  log('ROM URL: '+romUrl);
  if(biosUrl){
    log('BIOS: '+(biosName||'dependência')+' — '+new URL(biosUrl,location.origin).href);
  }

  // EmulatorJS Arcade utiliza o core FBNeo nesta configuração.
  // A ROM ZIP deve ser compatível com o romset FBNeo.
  // ATENÇÃO: com EJS_dontExtractBIOS=true o EmulatorJS 4.2.3 usa a string da
  // URL da BIOS como caminho de gravação no sistema de arquivos do core
  // (FS.writeFile(url)). Por isso ela precisa ser um caminho relativo simples
  // na raiz, como "/neogeo.zip" — nada de URL absoluta nem query string.
  const biosFile=(biosName||biosUrl.split('/').pop()||'').split('?')[0].split('#')[0];
  window.EJS_biosUrl=biosFile?'/'+biosFile:'';
  window.EJS_gameParentUrl='';
  window.EJS_externalFiles={};

  // Mantém o ZIP da BIOS intacto para o core fazer o merge com o romset.
  window.EJS_dontExtractBIOS=true;

  if(window.EJS_biosUrl){
    log('BIOS configurado via EJS_biosUrl: '+window.EJS_biosUrl);
    try{
      const head=await fetch(window.EJS_biosUrl,{method:'HEAD'});
      const len=head.headers.get('content-length');
      log('Checagem HEAD da BIOS: status '+head.status+', tamanho '+(len||'desconhecido')+' bytes');
      if(!head.ok){
        log('AVISO: endpoint da BIOS não respondeu OK — o core pode falhar ao montar o arquivo.');
      }
    }catch(e){
      log('Checagem HEAD da BIOS falhou: '+(e?.message||e)+' (pode ser CORS ou rede)');
    }
  }

  // Jogos CPS2 precisam de arquivo .key nos romsets para o FBNeo (core "arcade").
  // Os romsets hospedados são de época anterior a essa exigência, então os jogos
  // CPS2 usam o core fbalpha2012_cps2, que tem as chaves de decriptação embutidas.
  const CPS2_GAMES=new Set([
    'avsp','avspu','ddsom','ddtod','dino','dstlk','hsf2','megaman2','msh','mshvsf',
    'mvsc','nwarr','nwarru','sfa','sfa2','sfa2u','sfa3','sfz2al','sfz2ald','sgemf',
    'spf2t','ssf2','ssf2t','vhunt2','vsav','vsavj','xmcota','xmvsf','xmvsfe',
    'xmvsfu','xmvsfur1','xmvsfj','armwar','cybots','gigawing','mmatrix','progear'
  ]);
  const romBase=name.replace(/\.(zip|7z|chd)$/i,'').toLowerCase();
  const core=CPS2_GAMES.has(romBase)?'fbalpha2012_cps2':'arcade';
  const coreLabel=core==='arcade'?'Arcade (FBNeo)':'CPS2 (FBAlpha 2012)';

  status.textContent='INICIANDO '+coreLabel+' — '+name+'...';

  window.EJS_player='#game';
  window.EJS_core=core;
  window.EJS_gameName=name.replace(/\.(zip|7z|chd)$/i,'');
  // Cada ROM precisa de um perfil próprio. Antes, todos os jogos arcade
  // compartilhavam o perfil "ejs-arcade-settings"; um core salvo ou inválido
  // podia fazer o próximo título abrir apenas o menu do EmulatorJS.
  let gameId=0;
  // O perfil anterior podia ter salvo START/SELECT compartilhados entre os
  // jogadores. Mudar a assinatura força o EmulatorJS a usar os controles
  // corrigidos sem apagar volume ou outras preferências do usuário.
  const CONTROL_PROFILE_VERSION='mga-players-credits-v2';
  for(const char of `${CONTROL_PROFILE_VERSION}:${romBase}`) gameId=((gameId*31)+char.charCodeAt(0))>>>0;
  window.EJS_gameID=gameId||1;
  // Define o core esperado mesmo quando há configurações antigas salvas.
  window.EJS_defaultOptions={retroarch_core:core==='arcade'?'fbneo':'fbalpha2012_cps2'};
  window.EJS_gameUrl=romUrl;

  // Versão fixada para evitar alterações automáticas no core.
  const EJS_PINNED_VERSION='4.2.3';
  // Self-hosted: EmulatorJS 4.2.3 + cores FBNeo/FBAlpha2012 CPS2 vivem em
  // /web/emulatorjs-data/ dentro do próprio repo (sem depender do CDN
  // público). O CDN só é usado como failsafe automático (emulator.js já
  // tenta cdn.emulatorjs.org sozinho se algum arquivo local faltar).
  window.EJS_pathtodata='/web/emulatorjs-data/';
  // Iniciar automaticamente: o usuário deve ver diretamente o jogo, sem a
  // tela/botão do EmulatorJS.
  window.EJS_startOnLoaded=true;
  window.EJS_alignStartButton='center';
  window.EJS_language='en-US';
  window.EJS_disableAutoLang=true;
  window.EJS_volume=0;
  window.EJS_color='#00e5ff';
  window.EJS_backgroundColor='#000';
  window.EJS_DEBUG_XX=true;

  const hide=()=>{
    status.style.display='none';
    manual.style.display='none';
  };

  // ---------------------------------------------------------------
  // Controles de teclado (valem para TODOS os jogos)
  // Jogador 1: setas + Z X A S (socos/chutes), Enter = Start, Shift = Coin.
  // Jogador 2: T F G H + J K U I, V = Start, C = Coin. As teclas de
  // SELECT/START são deliberadamente diferentes: P2 só entra depois de
  // inserir o crédito dele e pressionar o próprio START.
  // ---------------------------------------------------------------
  window.EJS_defaultControls={
    0:{
      0:{value:'z',value2:'BUTTON_2'},
      1:{value:'a',value2:'BUTTON_4'},
      2:{value:'shift',value2:'SELECT'},
      3:{value:'enter',value2:'START'},
      4:{value:'up arrow',value2:'DPAD_UP'},
      5:{value:'down arrow',value2:'DPAD_DOWN'},
      6:{value:'left arrow',value2:'DPAD_LEFT'},
      7:{value:'right arrow',value2:'DPAD_RIGHT'},
      8:{value:'x',value2:'BUTTON_1'},
      9:{value:'s',value2:'BUTTON_3'},
      10:{value:'q',value2:'LEFT_TOP_SHOULDER'},
      11:{value:'w',value2:'RIGHT_TOP_SHOULDER'},
      12:{value:'1',value2:'LEFT_BOTTOM_SHOULDER'},
      13:{value:'2',value2:'RIGHT_BOTTOM_SHOULDER'},
      14:{value:'',value2:'LEFT_STICK'},
      15:{value:'',value2:'RIGHT_STICK'},
      16:{value:'',value2:'LEFT_STICK_X:+1'},
      17:{value:'',value2:'LEFT_STICK_X:-1'},
      18:{value:'',value2:'LEFT_STICK_Y:+1'},
      19:{value:'',value2:'LEFT_STICK_Y:-1'},
      20:{value:'',value2:'RIGHT_STICK_X:+1'},
      21:{value:'',value2:'RIGHT_STICK_X:-1'},
      22:{value:'',value2:'RIGHT_STICK_Y:+1'},
      23:{value:'',value2:'RIGHT_STICK_Y:-1'},
      24:{value:''},25:{value:''},26:{value:''},27:{},28:{},29:{}
    },
    1:{
      0:{value:'j',value2:'BUTTON_2'},
      1:{value:'u',value2:'BUTTON_4'},
      2:{value:'c',value2:'SELECT'},
      3:{value:'v',value2:'START'},
      4:{value:'t',value2:'DPAD_UP'},
      5:{value:'g',value2:'DPAD_DOWN'},
      6:{value:'f',value2:'DPAD_LEFT'},
      7:{value:'h',value2:'DPAD_RIGHT'},
      8:{value:'k',value2:'BUTTON_1'},
      9:{value:'i',value2:'BUTTON_3'},
      10:{value:'o',value2:'LEFT_TOP_SHOULDER'},
      11:{value:'p',value2:'RIGHT_TOP_SHOULDER'},
      12:{value:'3',value2:'LEFT_BOTTOM_SHOULDER'},
      13:{value:'4',value2:'RIGHT_BOTTOM_SHOULDER'}
    },
    2:{},3:{}
  };

  // Alguns cores CPS2 não encaminham de forma consistente SELECT/START pelo
  // listener interno do EmulatorJS. Envie esses quatro comandos diretamente
  // ao jogador correspondente. Mantemos os atalhos antigos (Shift/Enter e
  // C/V) e também os padrões de gabinete (5/1 e 6/2).
  const arcadeSystemKeys={
    shift:[0,2], enter:[0,3], '1':[0,3], '5':[0,2],
    c:[1,2], v:[1,3], '2':[1,3], '6':[1,2]
  };
  const forwardArcadeSystemKey=e=>{
    if(!started||e.repeat)return;
    const mapping=arcadeSystemKeys[String(e.key||'').toLowerCase()];
    if(!mapping)return;
    const manager=window.EJS_emulator?.gameManager;
    if(!manager?.simulateInput)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    manager.simulateInput(mapping[0],mapping[1],e.type==='keyup'?0:1);
  };
  document.addEventListener('keydown',forwardArcadeSystemKey,true);
  document.addEventListener('keyup',forwardArcadeSystemKey,true);

  const goFullscreen=()=>{
    try{
      const el=document.documentElement;
      if(document.fullscreenElement)return;
      const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
      if(req){
        const p=req.call(el,{navigationUI:'hide'});
        if(p&&p.catch)p.catch(err=>log('Tela cheia recusada: '+(err?.message||err)));
        log('Tela cheia solicitada');
      }
    }catch(e){
      log('Tela cheia falhou: '+(e?.message||e));
    }
  };

  // F11 alterna tela cheia; F9 mostra diagnóstico; Escape fecha o player.
  addEventListener('keydown',e=>{
    if(e.key==='F11'||e.code==='F11'){
      e.preventDefault();
      document.fullscreenElement?document.exitFullscreen():goFullscreen();
    }
    if(e.key==='F9'||e.code==='F9'){
      e.preventDefault();
      const debug=document.getElementById('debug');
      if(debug) debug.style.display=debug.style.display==='none'?'block':'none';
    }
    if(e.key==='F2'){e.preventDefault();visual.scanlines=!visual.scanlines;applyVisual();log('Scanlines: '+(visual.scanlines?'ligadas':'desligadas'));}
    if(e.key==='F3'){e.preventDefault();visual.integer=!visual.integer;applyVisual();log('Escala inteira: '+(visual.integer?'ligada':'desligada'));}
    if(e.key==='F4'){e.preventDefault();cycleVisual();}
    if(e.key==='F5'){e.preventDefault();visual.palette=visual.palette==='normal'?'amber':visual.palette==='amber'?'cool':visual.palette==='cool'?'soft':'normal';applyVisual();log('Paleta: '+visual.palette);}
    if(e.key==='F6'){e.preventDefault();visual.brightness=visual.brightness>=1.25?.85:+(visual.brightness+.1).toFixed(2);applyVisual();log('Brilho: '+visual.brightness);}
    if(e.key==='F7'){e.preventDefault();visual.contrast=visual.contrast>=1.3?.85:+(visual.contrast+.1).toFixed(2);applyVisual();log('Contraste: '+visual.contrast);}
    if(e.key==='F8'){e.preventDefault();visual.saturation=visual.saturation>=1.4?.75:+(visual.saturation+.15).toFixed(2);applyVisual();log('Saturação: '+visual.saturation);}
    if(e.key==='F10'){e.preventDefault();visual.vignette=!visual.vignette;applyVisual();log('Vinheta: '+(visual.vignette?'ligada':'desligada'));}
    if(e.key==='?'||e.key==='h'){e.preventDefault();visualHelp();}
    if(e.key==='Escape'&&!e.target.matches('input,textarea,button')){
      try{parent.postMessage({type:'mga-emulator-exit'},location.origin)}catch{}
    }
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) log('Player retomado após retorno à aba.');
  });

  window.EJS_onGameStart=()=>{
    if(started)return;
    started=true;
    attempting=false;
    if(retryTimer)clearTimeout(retryTimer);
    if(startWatchdog)clearTimeout(startWatchdog);
    hide();
    log('Arcade/FBNeo iniciou o jogo');
    goFullscreen();

    try{
      const fs=window.EJS_emulator?.gameManager?.FS;
      if(fs){
        const expected=biosName||'BIOS';
        const checks=[
          `/${expected}`,
          '/home/web_user/retroarch/userdata/system/'+expected,
          '/home/web_user/retroarch/userdata/system/fbneo/'+expected
        ];
        const found=checks.filter(p=>{
          try{fs.stat(p);return true}catch{return false}
        });
        log(expected+' encontrado no FS: '+(found.length?found.join(' | '):'não exposto pelo wrapper'));
      }
    }catch(e){
      log('Diagnóstico FS: '+(e?.message||e));
    }

    try{parent.postMessage({type:'mga-emulator-started'},location.origin)}catch{}
  };

  // Inicia somente uma vez. O clique duplicado era capaz de chamar
  // toggleMainLoop antes de o módulo interno do EmulatorJS estar pronto.
  const findStartButton=()=>{
    // Só o botão de início real do EmulatorJS (tela de start), nunca os
    // botões da barra de controles (play/pause etc.), que chamam
    // toggleMainLoop antes de o core existir.
    const real=document.querySelector(
      '.ejs_start_button,.ejs_startbutton,#ejs_start_button,.ejs_start_screen button,[class*="ejs-start"] button,[class*="ejs_start"] button'
    );
    if(real) return real;
    const els=[...document.querySelectorAll('.ejs_start_screen button,.ejs_start_screen [role="button"]')];
    return els.find(e=>/^\s*(start game|start|play)\s*$/i.test((e.textContent||'').trim()))||null;
  };

  const tryStart=()=>{
    if(started||attempting)return false;

    // Com início automático ligado não clicamos em nada: o EmulatorJS
    // inicia sozinho e qualquer clique cairia na barra de controles.
    if(window.EJS_startOnLoaded){
      log('Início automático ativo; nenhum clique sintético será feito.');
      return false;
    }

    const b=findStartButton();
    if(!b){
      log('Botão de início real do EmulatorJS ainda não existe.');
      return false;
    }

    attempting=true;
    b.click();
    log('Botão de início real acionado uma única vez');

    setTimeout(()=>{
      if(!started){
        attempting=false;
        log('O core ainda não iniciou; nova tentativa poderá ser feita manualmente.');
      }
    },5000);

    return true;
  };

  const showManualStart=()=>{
    if(!started){
      status.style.display='none';
      manual.style.display='block';
      log('Aguardando clique do usuário para iniciar o Arcade/FBNeo');
    }
  };

  manual.addEventListener('click',()=>{
    manual.style.display='none';
    goFullscreen();
    const b=findStartButton();
    if(b&&!started){
      attempting=true;
      b.click();
      log('Início manual: botão real do EmulatorJS acionado');
      setTimeout(()=>{if(!started)attempting=false;},5000);
    }else{
      log('Sem botão de início real; aguardando o início automático do core.');
      if(!started) showManualStart();
    }
  });

  // Não usamos listener global de clique: ele podia capturar o clique
  // sintético do EmulatorJS e iniciar o core duas vezes.

  const hideEmulatorUi=()=>{
    document.querySelectorAll('#game button,#game [role="button"],#game .ejs_menu_bar,#game .ejs_menu,#game .ejs_context_menu,#game .ejs_volume_parent').forEach(el=>{
      el.style.display='none';
    });
  };

  window.EJS_ready=()=>{
    ready=true;
    log('EmulatorJS pronto; o jogo será iniciado automaticamente');
    // Algumas versões do EmulatorJS exibem o menu RetroArch mesmo com
    // startOnLoad=true. Acione o botão interno uma vez como fallback, antes
    // de ocultar a camada de controles.
    setTimeout(()=>{
      if(!started&&!attempting&&!window.EJS_startOnLoaded) tryStart();
    },700);
    hideEmulatorUi();
    setTimeout(hideEmulatorUi,300);
    setTimeout(hideEmulatorUi,1500);
  };

  addEventListener('error',e=>{
    log('window.error: '+(e.message||'erro mascarado pelo CDN'));
    if(attempting&&!started&&retriesLeft>0&&!window.EJS_startOnLoaded){
      retriesLeft--;
      attempting=false;
      log('Possível corrida de inicialização — tentando novamente em 2.5s ('+retriesLeft+' restantes)');
      retryTimer=setTimeout(()=>{
        if(!started)tryStart();
      },2500);
    }
  });

  addEventListener('unhandledrejection',e=>{
    log('unhandledrejection: '+(e.reason?.message||e.reason));
  });

  new MutationObserver(hideEmulatorUi).observe(document.getElementById('game'),{childList:true,subtree:true});

  startWatchdog=setTimeout(()=>{
    if(!ready&&!started){
      fail('Arcade não carregou em 30s. Verifique a ROM, o BIOS e o endpoint de download.');
    }
  },30000);

  setTimeout(()=>{
    if(ready&&!started){
      fail('EmulatorJS ficou pronto, mas o core Arcade (FBNeo) não iniciou a ROM. Confirme o romset e o BIOS.');
    }
  },45000);

  // Os controles de teclado e gamepad são tratados pelo próprio EmulatorJS
  // através de EJS_defaultControls (mapa acima). Nenhum remapeamento manual.

  const script=document.createElement('script');
  script.src=window.EJS_pathtodata+'loader.js';
  script.async=true;
  script.onerror=()=>{
    log('loader.js local falhou — tentando fallback pelo CDN oficial.');
    window.EJS_pathtodata='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/';
    const fallback=document.createElement('script');
    fallback.src=window.EJS_pathtodata+'loader.js';
    fallback.async=true;
    fallback.crossOrigin='anonymous';
    fallback.onerror=()=>fail('Não foi possível carregar o EmulatorJS (local nem CDN).');
    document.head.appendChild(fallback);
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
