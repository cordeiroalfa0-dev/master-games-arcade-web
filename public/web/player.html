<body>
  <div id="game"></div>
  <div id="loading-art" aria-label="Imagem de carregamento"></div>
  <div id="mga-rotate-warning" role="status">GIRE O CELULAR<br><small style="color:#fff;font-size:12px">Este jogo funciona na horizontal.</small></div>
  <div id="status">CARREGANDO...</div>
  <pre id="debug"></pre>
  <button id="manual-start" type="button">▶ CLIQUE PARA INICIAR</button>
  
  <div id="player-controls">
    <button id="btn-save" class="mga-ctrl-btn" type="button" title="Salvar e Carregar Partidas (15 Slots)" aria-label="Saves">💾 Saves</button>
    <button id="btn-pause" class="mga-ctrl-btn" type="button" title="Pausar / Retomar Jogo" aria-label="Pausa">⏸</button>
    <button id="btn-haptic" class="mga-ctrl-btn" type="button" title="Vibração Tátil nos Botões (Haptic)" aria-label="Vibração">📳</button>
    <button id="btn-opacity" class="mga-ctrl-btn" type="button" title="Ajustar Opacidade dos Controles Virtuais" aria-label="Opacidade">👁 75%</button>
    <button id="btn-fullscreen" type="button" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    <button id="btn-close" type="button" title="Fechar" aria-label="Fechar">✕</button>
  </div>


  <div id="mga-saves-modal" role="dialog" aria-modal="true" aria-labelledby="mga-modal-title">
    <div class="mga-modal-dialog">
      <div class="mga-modal-header">
        <span id="mga-modal-title" class="mga-modal-title">💾 PARTIDAS SALVAS (15 SLOTS)</span>
        <button id="mga-modal-close" class="mga-modal-close" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="mga-modal-actions">
        <button id="mga-btn-return" class="mga-btn-action mga-btn-return" type="button">▶ Voltar à partida</button>
        <button id="mga-btn-quick-save" class="mga-btn-action" type="button">⚡ Quick Save</button>
        <button id="mga-btn-quick-load" class="mga-btn-action" type="button">⚡ Quick Load</button>
        <span style="font-size:10px;color:#888;margin-left:auto;">Toque em Salvar ou Carregar no slot desejado</span>
      </div>
      <div id="mga-slots-list" class="mga-slots-grid"></div>
    </div>
  </div>
  <div id="mga-toast"></div>

<script>
(async()=>{
  try {
    if (screen.orientation?.lock) {
      screen.orientation.lock("landscape").catch(()=>{});
    }
  } catch {}
  const q=new URLSearchParams(location.search);
  const rom=q.get('rom');
  const biosUrl=q.get('bios')||'';
  const biosName=q.get('biosName')||'';
  const name=q.get('name')||'Master Games Arcade';
  const status=document.getElementById('status');
  const loadingArt=document.getElementById('loading-art');
  const debug=document.getElementById('debug');
  const manual=document.getElementById('manual-start');
  const rotateWarning=document.getElementById('mga-rotate-warning');
  const logs=[];
  let difficulty;

  // Ative a janela de partidas antes de qualquer await ou inicialização do
  // emulador. Assim o botão Saves continua funcionando mesmo se o core/BIOS
  // travar ou falhar antes de terminar o restante deste script.
  const earlySavesModal=document.getElementById('mga-saves-modal');
  const earlySavesButton=document.getElementById('btn-save');
  const earlySavesClose=document.getElementById('mga-modal-close');
  const earlySavesReturn=document.getElementById('mga-btn-return');
  const earlyOpenSaves=()=>{
    if(!earlySavesModal)return;
    earlySavesModal.classList.add('open');
    const list=document.getElementById('mga-slots-list');
    if(list&&!window.MGA_refreshSaves)list.innerHTML='<div style="color:#00e5ff;font-size:12px;padding:8px;">Carregando slots...</div>';
    window.MGA_refreshSaves?.();
  };
  const earlyCloseSaves=()=>earlySavesModal?.classList.remove('open');
  earlySavesButton?.addEventListener('click',earlyOpenSaves);
  earlySavesClose?.addEventListener('click',earlyCloseSaves);
  earlySavesReturn?.addEventListener('click',earlyCloseSaves);
  earlySavesModal?.addEventListener('click',e=>{
    if(e.target===earlySavesModal)earlyCloseSaves();
  });
  window.MGA_openSaves=earlyOpenSaves;
  window.addEventListener('message',e=>{
    if(e.data?.type==='mga-open-saves')earlyOpenSaves();
  });

  // Escapa texto vindo da URL antes de inserir em innerHTML (evita XSS via ?name=).
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const difficultyStorageKey='mga-difficulty-mode-v1';
  const gameKey=(name||rom).replace(/\.(zip|7z|chd)$/i,'').toLowerCase();
  const readDifficulty=()=>{
    try{
      const saved=JSON.parse(localStorage.getItem(difficultyStorageKey)||'{}');
      return saved[gameKey]==='hard'?'hard':'easy';
    }catch{return 'easy';}
  };
  const saveDifficulty=mode=>{
    try{
      const saved=JSON.parse(localStorage.getItem(difficultyStorageKey)||'{}');
      saved[gameKey]=mode==='hard'?'hard':'easy';
      localStorage.setItem(difficultyStorageKey,JSON.stringify(saved));
    }catch{}
  };
  const chooseDifficulty=()=>new Promise(resolve=>{
    const current=readDifficulty();
    const panel=document.createElement('div');
    panel.id='difficulty-setup';
    panel.innerHTML=`<div class="difficulty-card"><div style="color:#00e5ff;font-size:12px;letter-spacing:2px;margin-bottom:12px">CONFIGURAÇÃO DO JOGO</div><h1>${esc(name||'Master Games Arcade')}</h1><p>Escolha o modo e ajuste a apresentação antes de iniciar. Os jogos para celular funcionam somente na horizontal.</p><div class="difficulty-actions"><button type="button" data-difficulty="easy">FÁCIL<br><small>mais vidas e continues</small></button><button type="button" data-difficulty="hard">DIFÍCIL<br><small>desafio máximo</small></button></div><div class="config-section"><div class="config-title">VÍDEO</div><div class="config-grid"><label>Paleta <select data-setting="palette"><option value="normal">Normal</option><option value="cool">Fria</option><option value="amber">Âmbar</option><option value="soft">Suave</option></select></label><label><input type="checkbox" data-setting="scanlines"> Scanlines</label><label><input type="checkbox" data-setting="vignette"> Vinheta</label><label><input type="checkbox" data-setting="integer"> Escala inteira</label><label><input type="checkbox" data-setting="shader"> Shader SABR</label></div></div><div class="config-section"><div class="config-title">CONTROLES</div><div class="controls-note"><b>P1:</b> Shift/5 crédito · Enter/1 entrar · setas + Z/X/A/S jogar.<br><b>P2:</b> só entra quando solicitado · C/V ou 6/2 crédito/START.<br>Segundo controle USB continua disponível.</div></div><div style="margin-top:18px;color:#aaa;font-size:10px">DIP switches são aplicados quando o core expõe a opção.</div></div>`;
    const palette=panel.querySelector('[data-setting="palette"]');
    palette.value=visual.palette;
    for(const key of ['scanlines','vignette','integer'])panel.querySelector(`[data-setting="${key}"]`).checked=!!visual[key];
    panel.querySelector('[data-setting="shader"]').checked=pixelEnhancement;
    const buttons=[...panel.querySelectorAll('[data-difficulty]')];
    buttons.forEach(button=>{
      if(button.dataset.difficulty===current)button.classList.add('selected');
      button.addEventListener('click',()=>{
        const mode=button.dataset.difficulty==='hard'?'hard':'easy';
        saveDifficulty(mode);
        visual.palette=palette.value;
        for(const key of ['scanlines','vignette','integer'])visual[key]=panel.querySelector(`[data-setting="${key}"]`).checked;
        pixelEnhancement=panel.querySelector('[data-setting="shader"]').checked;
        applyVisual();
        panel.remove();
        resolve(mode);
      });
    });
    document.body.appendChild(panel);
  });
  let ready=false;
  let started=false;
  let attempting=false;
  let retriesLeft=3;
  let retryTimer=null;
  let startWatchdog=null;

  const log=x=>{
    logs.push(`[${new Date().toLocaleTimeString()}] ${x}`);
    if(logs.length>80)logs.shift();
    debug.textContent=logs.join('\n');
    console.log('[MGA]',x);
  };

  const VISUAL_KEY='mga-video-profile-v2';
  // Perfil inicial mais nítido e colorido para sprites pixelados. A imagem
  // original continua intacta; os ajustes acontecem apenas na saída de vídeo.
  const visualDefaults={aspect:'stretch',integer:true,scanlines:false,vignette:true,palette:'normal',brightness:1.02,contrast:1.06,saturation:1.08};
  let visual={...visualDefaults};
  try{visual={...visual, ...JSON.parse(localStorage.getItem(VISUAL_KEY)||'{}')}}catch{}
  // Perfis antigos usavam "auto" (contain), que deixava barras laterais.
  // Migra somente esse modo; preferências explícitas 4:3/stretch continuam.
  visual.aspect='stretch';
  // Em telas de toque (celular) scanlines e vinheta ficam sempre desligados.
  // (Única declaração de isTouchDevice: a duplicada foi removida.)
  const isTouchDevice=navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches;
  if(isTouchDevice){visual.scanlines=false;visual.vignette=false;}
  // Rodando dentro do launcher (iframe)? Então o cabeçalho externo cobre o topo.
  let embedded=false;
  try{embedded=window.self!==window.top}catch{embedded=true}
  document.body.classList.toggle('mga-embedded',embedded);
  {
    const headerH=parseInt(q.get('headerH')||'',10);
    if(embedded&&headerH>0)document.documentElement.style.setProperty('--mga-header-h',headerH+'px');
  }
  const applyVisual=()=>{
    document.body.classList.toggle('video-auto',visual.aspect==='auto');
    document.body.classList.toggle('video-aspect-43',visual.aspect==='4:3');
    document.body.classList.toggle('video-stretch',visual.aspect==='stretch');
    document.body.classList.toggle('video-integer',!!visual.integer);
    document.body.classList.toggle('video-scanlines',!!visual.scanlines&&!isTouchDevice);
    document.body.classList.toggle('video-vignette',!!visual.vignette&&!isTouchDevice);
    document.body.classList.toggle('video-amber',visual.palette==='amber');
    document.body.classList.toggle('video-cool',visual.palette==='cool');
    document.body.classList.toggle('video-soft',visual.palette==='soft');
    document.getElementById('game')?.style.setProperty('--video-brightness',visual.brightness);
    document.getElementById('game')?.style.setProperty('--video-contrast',visual.contrast);
    document.getElementById('game')?.style.setProperty('--video-saturation',visual.saturation);
    try{localStorage.setItem(VISUAL_KEY,JSON.stringify(visual))}catch{}
  };
  const visualHelp=()=>log('Vídeo: F1 shader SABR | F2 scanlines | F3 escala inteira | F5 paleta | F6 brilho | F7 contraste | F8 saturação | F10 vinheta');
  applyVisual();
  let pixelEnhancement=!isTouchDevice;
  const applyPixelEnhancement=()=>{
    const emulator=window.EJS_emulator;
    if(!emulator?.enableShader)return;
    try{
      emulator.enableShader(pixelEnhancement?'sabr':'disabled');
      log('Shader de pixels: '+(pixelEnhancement?'SABR ligado':'desligado'));
    }catch(e){
      pixelEnhancement=false;
      log('Shader indisponível; mantendo filtro seguro de vídeo: '+(e?.message||e));
    }
  };
  difficulty=await chooseDifficulty();

  const fail=x=>{
    status.textContent=x;
    status.style.color='#ff2bd6';
    debug.style.display='block';
    manual.style.display='none';
    log('ERRO: '+x);
    try{parent.postMessage({type:'mga-emulator-error',message:x},location.origin)}catch{}
  };

  if(!rom){
    fail('ROM NÃO INFORMADA');
    return;
  }

  const updateRotationNotice=()=>{
    const portrait=isTouchDevice&&matchMedia('(orientation:portrait)').matches;
    rotateWarning?.classList.toggle('show',portrait);
    document.body.classList.toggle('mga-portrait-blocked',portrait);
  };
  updateRotationNotice();
  addEventListener('resize',updateRotationNotice,{passive:true});
  addEventListener('orientationchange',updateRotationNotice,{passive:true});

  const romUrl=new URL(rom,location.origin).href;
  log('Jogo: '+name);
  log('Modo de dificuldade: '+(difficulty==='hard'?'Difícil':'Fácil'));
  log('ROM URL: '+romUrl);
  if(biosUrl){
    log('BIOS: '+(biosName||'dependência')+' — '+new URL(biosUrl,location.origin).href);
  }

  // EmulatorJS Arcade utiliza o core FBNeo nesta configuração.
  // A ROM ZIP deve ser compatível com o romset FBNeo.
  // ATENÇÃO: com EJS_dontExtractBIOS=true o EmulatorJS 4.2.3 usa a string da
  // URL da BIOS como caminho de gravação no sistema de arquivos do core
  // (FS.writeFile(url)). Por isso ela precisa ser um caminho relativo simples
  // na raiz, como "/neogeo.zip" — nada de URL absoluta nem query string.
  const biosFile=(biosName||biosUrl.split('/').pop()||'').split('?')[0].split('#')[0];
  window.EJS_biosUrl=biosFile?'/'+biosFile:'';
  window.EJS_gameParentUrl='';
  window.EJS_externalFiles={};

  // Mantém o ZIP da BIOS intacto para o core fazer o merge com o romset.
  window.EJS_dontExtractBIOS=true;

  if(window.EJS_biosUrl){
    log('BIOS configurado via EJS_biosUrl: '+window.EJS_biosUrl);
    // Diagnóstico não deve bloquear o início do emulador: alguns CDNs e
    // navegadores móveis atrasam ou recusam HEAD mesmo aceitando GET.
    fetch(window.EJS_biosUrl,{method:'HEAD'}).then(head=>{
      const len=head.headers.get('content-length');
      log('Checagem HEAD da BIOS: status '+head.status+', tamanho '+(len||'desconhecido')+' bytes');
      if(!head.ok)log('AVISO: endpoint da BIOS não respondeu OK — o core pode falhar ao montar o arquivo.');
    }).catch(e=>log('Checagem HEAD da BIOS falhou: '+(e?.message||e)+' (pode ser CORS ou rede)'));
  }

  // Jogos CPS2 precisam de arquivo .key nos romsets para o FBNeo (core "arcade").
  // Os romsets hospedados são de época anterior a essa exigência, então os jogos
  // CPS2 usam o core fbalpha2012_cps2, que tem as chaves de decriptação embutidas.
  const CPS2_GAMES=new Set([
    'avsp','avspu','ddsom','ddtod','dstlk','hsf2','megaman2','msh','mshvsf',
    'mvsc','nwarr','nwarru','sfa','sfa2','sfa2u','sfa3','sfz2al','sfz2ald','sgemf',
    'spf2t','ssf2','ssf2t','vhunt2','vsav','vsavj','xmcota','xmvsf','xmvsfe',
    'xmvsfu','xmvsfur1','xmvsfj','armwar','cybots','gigawing','mmatrix','progear'
  ]);
  const romBase=name.replace(/\.(zip|7z|chd)$/i,'').toLowerCase();
  const core=CPS2_GAMES.has(romBase)?'fbalpha2012_cps2':'arcade';
  const coreLabel=core==='arcade'?'Arcade (FBNeo)':'CPS2 (FBAlpha 2012)';

  status.textContent='INICIANDO '+coreLabel+' — '+name+'...';

  // Perfil touch explícito para o arcade. O perfil padrão do EmulatorJS pode
  // variar por core e não expõe crédito/Start de forma consistente.
  window.EJS_VirtualGamepadSettings=[
    {type:'dpad',id:'dpad',location:'left',left:'50%',top:'50%',joystickInput:false,inputValues:[4,5,6,7]},
    {type:'button',text:'B',id:'b',location:'right',left:0,top:42,bold:true,input_value:0},
    {type:'button',text:'A',id:'a',location:'right',left:58,top:0,bold:true,input_value:8},
    {type:'button',text:'Y',id:'y',location:'right',left:58,top:84,bold:true,input_value:1},
    {type:'button',text:'X',id:'x',location:'right',left:116,top:42,bold:true,input_value:9},
    {type:'button',text:'CRÉDITO',id:'credit',location:'center',left:-48,top:0,fontSize:11,block:true,input_value:2},
    {type:'button',text:'START',id:'start',location:'center',left:38,top:0,fontSize:11,block:true,input_value:3}
  ];
  window.EJS_player='#game';
  window.EJS_core=core;
  window.EJS_gameName=name.replace(/\.(zip|7z|chd)$/i,'');
  // Cada ROM precisa de um perfil próprio. Antes, todos os jogos arcade
  // compartilhavam o perfil "ejs-arcade-settings"; um core salvo ou inválido
  // podia fazer o próximo título abrir apenas o menu do EmulatorJS.
  let gameId=0;
  // O perfil anterior podia ter salvo START/SELECT compartilhados entre os
  // jogadores. Mudar a assinatura força o EmulatorJS a usar os controles
  // corrigidos sem apagar volume ou outras preferências do usuário.
  const CONTROL_PROFILE_VERSION='mga-players-credits-p1-only-v3';
  for(const char of `${CONTROL_PROFILE_VERSION}:${romBase}`) gameId=((gameId*31)+char.charCodeAt(0))>>>0;
  window.EJS_gameID=gameId||1;
  // Define o core esperado mesmo quando há configurações antigas salvas.
  window.EJS_defaultOptions={retroarch_core:core==='arcade'?'fbneo':'fbalpha2012_cps2'};
  // O modo é mantido no perfil do jogo para que uma futura integração DIP
  // possa aplicar valores específicos sem alterar o romset ou o core.
  window.MGA_difficulty={mode:difficulty,rom:romBase,automatic:false};
  window.EJS_gameUrl=romUrl;

  // Versão fixada para evitar alterações automáticas no core.
  const EJS_PINNED_VERSION='4.2.3';
  // Self-hosted: EmulatorJS 4.2.3 + cores FBNeo/FBAlpha2012 CPS2 vivem em
  // /web/emulatorjs-data/ dentro do próprio repo (sem depender do CDN
  // público). O CDN só é usado como failsafe automático (emulator.js já
  // tenta cdn.emulatorjs.org sozinho se algum arquivo local faltar).
  window.EJS_pathtodata='/web/emulatorjs-data/';
  // No touch, aguarde o toque explícito do usuário para reduzir a corrida de
  // inicialização e liberar áudio/tela cheia no gesto que inicia o jogo.
  window.EJS_startOnLoaded=!isTouchDevice;
  window.EJS_alignStartButton='center';
  window.EJS_language='en-US';
  window.EJS_disableAutoLang=true;
  // O som do jogo precisa tocar durante a partida. Antes o volume nascia em 0
  // (mudo) e nunca era religado.
  window.EJS_volume=1;
  window.EJS_color='#00e5ff';
  window.EJS_backgroundColor='#000';
  window.EJS_DEBUG_XX=true;

  const hide=()=>{
    status.style.display='none';
    manual.style.display='none';
    loadingArt.classList.add('hidden');
  };

  // ---------------------------------------------------------------
  // Controles de teclado (valem para TODOS os jogos)
  // Jogador 1: setas + Z X A S (socos/chutes), Enter = Start, Shift = Coin.
  // Jogador 2: T F G H + J K U I, V = Start, C = Coin. As teclas de
  // SELECT/START são deliberadamente diferentes: P2 só entra depois de
  // inserir o crédito dele e pressionar o próprio START.
  // ---------------------------------------------------------------
  window.EJS_defaultControls={
    0:{
      0:{value:'z',value2:'BUTTON_2'},
      1:{value:'a',value2:'BUTTON_4'},
      2:{value:'shift',value2:'SELECT'},
      3:{value:'enter',value2:'START'},
      4:{value:'up arrow',value2:'DPAD_UP'},
      5:{value:'down arrow',value2:'DPAD_DOWN'},
      6:{value:'left arrow',value2:'DPAD_LEFT'},
      7:{value:'right arrow',value2:'DPAD_RIGHT'},
      8:{value:'x',value2:'BUTTON_1'},
      9:{value:'s',value2:'BUTTON_3'},
      10:{value:'q',value2:'LEFT_TOP_SHOULDER'},
      11:{value:'w',value2:'RIGHT_TOP_SHOULDER'},
      12:{value:'1',value2:'LEFT_BOTTOM_SHOULDER'},
      13:{value:'2',value2:'RIGHT_BOTTOM_SHOULDER'},
      14:{value:'',value2:'LEFT_STICK'},
      15:{value:'',value2:'RIGHT_STICK'},
      16:{value:'',value2:'LEFT_STICK_X:+1'},
      17:{value:'',value2:'LEFT_STICK_X:-1'},
      18:{value:'',value2:'LEFT_STICK_Y:+1'},
      19:{value:'',value2:'LEFT_STICK_Y:-1'},
      20:{value:'',value2:'RIGHT_STICK_X:+1'},
      21:{value:'',value2:'RIGHT_STICK_X:-1'},
      22:{value:'',value2:'RIGHT_STICK_Y:+1'},
      23:{value:'',value2:'RIGHT_STICK_Y:-1'},
      24:{value:''},25:{value:''},26:{value:''},27:{},28:{},29:{}
    },
    1:{
      0:{value:'j',value2:'BUTTON_2'},
      1:{value:'u',value2:'BUTTON_4'},
      // P2 não recebe crédito nem entra automaticamente. Os atalhos C/V
      // (ou 6/2) são encaminhados abaixo somente quando o usuário solicitar.
      // Mantemos value2 para que um segundo gamepad continue funcionando.
      2:{value:'',value2:'SELECT'},
      3:{value:'',value2:'START'},
      4:{value:'t',value2:'DPAD_UP'},
      5:{value:'g',value2:'DPAD_DOWN'},
      6:{value:'f',value2:'DPAD_LEFT'},
      7:{value:'h',value2:'DPAD_RIGHT'},
      8:{value:'k',value2:'BUTTON_1'},
      9:{value:'i',value2:'BUTTON_3'},
      10:{value:'o',value2:'LEFT_TOP_SHOULDER'},
      11:{value:'p',value2:'RIGHT_TOP_SHOULDER'},
      12:{value:'3',value2:'LEFT_BOTTOM_SHOULDER'},
      13:{value:'4',value2:'RIGHT_BOTTOM_SHOULDER'}
    },
    2:{},3:{}
  };

  // Alguns cores CPS2 não encaminham de forma consistente SELECT/START pelo
  // listener interno do EmulatorJS. Envie esses quatro comandos diretamente
  // ao jogador correspondente. Mantemos os atalhos antigos (Shift/Enter e
  // C/V) e também os padrões de gabinete (5/1 e 6/2).
  const arcadeSystemKeys={
    shift:[0,2], enter:[0,3], '1':[0,3], '5':[0,2],
    c:[1,2], v:[1,3], '2':[1,3], '6':[1,2]
  };
  const forwardArcadeSystemKey=e=>{
    if(!started||e.repeat)return;
    const mapping=arcadeSystemKeys[String(e.key||'').toLowerCase()];
    if(!mapping)return;
    const manager=window.EJS_emulator?.gameManager;
    // EmulatorJS expõe o cwrap em gameManager.functions; algumas versões
    // também oferecem o método direto. Use ambos para manter compatibilidade.
    const simulateInput=manager?.functions?.simulateInput||manager?.simulateInput;
    if(typeof simulateInput!=='function')return;
    e.preventDefault();
    e.stopImmediatePropagation();
    simulateInput.call(manager,mapping[0],mapping[1],e.type==='keyup'?0:1);
  };
  document.addEventListener('keydown',forwardArcadeSystemKey,true);
  document.addEventListener('keyup',forwardArcadeSystemKey,true);

  const goFullscreen=()=>{
    try{
      const el=document.documentElement;
      if(document.fullscreenElement)return;
      const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
      if(req){
        const p=req.call(el,{navigationUI:'hide'});
        if(p&&p.then)p.then(()=>{
          // Ao abrir o jogo, trava a tela em horizontal automaticamente.
          if(isTouchDevice&&screen.orientation?.lock){
            screen.orientation.lock('landscape').catch(err=>log('Bloqueio de orientação recusado: '+(err?.message||err)));
          }
        }).catch(err=>log('Tela cheia recusada: '+(err?.message||err)));
        log('Tela cheia solicitada');
      }
    }catch(e){
      log('Tela cheia falhou: '+(e?.message||e));
    }
  };

  document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement&&screen.orientation?.unlock){
      try{screen.orientation.unlock()}catch{}
    }
  },{passive:true});

  // F11 alterna tela cheia; F9 mostra diagnóstico; Escape fecha o player.
  addEventListener('keydown',e=>{
    if(e.key==='F11'||e.code==='F11'){
      e.preventDefault();
      document.fullscreenElement?document.exitFullscreen():goFullscreen();
    }
    if(e.key==='F9'||e.code==='F9'){
      e.preventDefault();
      // O #debug começa oculto pelo CSS (não por style inline), então o estado
      // real precisa vir de getComputedStyle; senão o 1º F9 não fazia nada.
      debug.style.display=getComputedStyle(debug).display==='none'?'block':'none';
    }
    if(e.key==='F1'){e.preventDefault();pixelEnhancement=!pixelEnhancement;applyPixelEnhancement();}
    if(e.key==='F2'){e.preventDefault();visual.scanlines=!visual.scanlines;applyVisual();log('Scanlines: '+(visual.scanlines?'ligadas':'desligadas'));}
    if(e.key==='F3'){e.preventDefault();visual.integer=!visual.integer;applyVisual();log('Escala inteira: '+(visual.integer?'ligada':'desligada'));}
    if(e.key==='F5'){e.preventDefault();visual.palette=visual.palette==='normal'?'amber':visual.palette==='amber'?'cool':visual.palette==='cool'?'soft':'normal';applyVisual();log('Paleta: '+visual.palette);}
    if(e.key==='F6'){e.preventDefault();visual.brightness=visual.brightness>=1.25?.85:+(visual.brightness+.1).toFixed(2);applyVisual();log('Brilho: '+visual.brightness);}
    if(e.key==='F7'){e.preventDefault();visual.contrast=visual.contrast>=1.3?.85:+(visual.contrast+.1).toFixed(2);applyVisual();log('Contraste: '+visual.contrast);}
    if(e.key==='F8'){e.preventDefault();visual.saturation=visual.saturation>=1.4?.75:+(visual.saturation+.15).toFixed(2);applyVisual();log('Saturação: '+visual.saturation);}
    if(e.key==='F10'){e.preventDefault();visual.vignette=!visual.vignette;applyVisual();log('Vinheta: '+(visual.vignette?'ligada':'desligada'));}
    if(e.key==='?'||e.key==='h'){e.preventDefault();visualHelp();}
    if(e.key==='Escape'&&!e.target.matches('input,textarea,button')){
      try{parent.postMessage({type:'mga-emulator-exit-requested'},location.origin)}catch{}
    }
  });

  // Botões flutuantes: fechar e tela cheia
  const playerControls=document.getElementById('player-controls');
  const btnClose=document.getElementById('btn-close');
  const btnFullscreen=document.getElementById('btn-fullscreen');
  btnClose.addEventListener('click',()=>{
    try{parent.postMessage({type:'mga-emulator-exit-requested'},location.origin)}catch{}
  });
  btnFullscreen.addEventListener('click',goFullscreen);

  // Toque longo no Android/iOS não deve abrir menu de contexto sobre o jogo.
  if(isTouchDevice)addEventListener('contextmenu',e=>e.preventDefault());

  // Mantém a tela ligada durante o jogo (suportado no Chrome/Edge Android).
  let wakeLock=null;
  const requestWakeLock=async()=>{
    if(!isTouchDevice||!('wakeLock' in navigator))return;
    try{wakeLock=await navigator.wakeLock.request('screen');log('Tela mantida ligada (wake lock)')}catch(e){log('Wake lock: '+(e?.message||e))}
  };
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&started)requestWakeLock();
  },{passive:true});

  // Auto-esconde os botões após 3s de inatividade (apenas desktop)
  let controlsHideTimer;
  const showPlayerControls=()=>{
    playerControls.classList.remove('hidden');
    clearTimeout(controlsHideTimer);
    if(!isTouchDevice){
      controlsHideTimer=setTimeout(()=>playerControls.classList.add('hidden'),3000);
    }
  };
  addEventListener('mousemove',showPlayerControls,{passive:true});
  addEventListener('touchstart',showPlayerControls,{passive:true,capture:true});
  showPlayerControls();
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) log('Player retomado após retorno à aba.');
  });
  // Alguns navegadores móveis atualizam o viewport depois do evento resize.
  // Reemite resize em dois frames para o EmulatorJS recalcular o canvas e o
  // gamepad depois de uma rotação, sem forçar a orientação do aparelho.
  let orientationResizeTimer;
  let orientationResizeFrame=0;
  let lastViewportWidth=innerWidth;
  let lastViewportHeight=innerHeight;
  const refreshAfterOrientation=()=>{
    clearTimeout(orientationResizeTimer);
    cancelAnimationFrame(orientationResizeFrame);
    const refresh=()=>{
      if(innerWidth===lastViewportWidth&&innerHeight===lastViewportHeight)return;
      lastViewportWidth=innerWidth;
      lastViewportHeight=innerHeight;
      window.dispatchEvent(new Event('resize'));
    };
    orientationResizeFrame=requestAnimationFrame(refresh);
    orientationResizeTimer=setTimeout(refresh,220);
  };
  addEventListener('orientationchange',refreshAfterOrientation,{passive:true});
  const updateViewport=()=>{
    document.documentElement.style.setProperty('--mga-vw',`${innerWidth}px`);
    document.documentElement.style.setProperty('--mga-vh',`${innerHeight}px`);
    document.body.classList.toggle('mga-portrait',innerHeight>=innerWidth);
    document.body.classList.toggle('mga-landscape',innerWidth>innerHeight);
    fitMobileGameViewport();
  };
  const fitMobileGameViewport=()=>{
    if(!isTouchDevice||innerWidth<=innerHeight)return;
    const game=document.getElementById('game');
    const parent=game?.querySelector('.ejs_canvas_parent');
    const canvas=game?.querySelector('canvas,video');
    if(!game||!parent||!canvas)return;
    parent.style.setProperty('height','var(--mga-l-game)','important');
    parent.style.setProperty('top','0px','important');
    canvas.style.setProperty('height','var(--mga-l-game)','important');
    canvas.style.setProperty('transform','none','important');
    canvas.style.setProperty('object-fit','fill','important');
  };
  addEventListener('resize',updateViewport,{passive:true});
  visualViewport?.addEventListener('resize',refreshAfterOrientation,{passive:true});
  updateViewport();

  const chooseCoreOptionValue=(options,mode,kind)=>{
    const values=options.map(value=>({raw:value,label:value.replace(/^\([^)]*\)\s*/,'').trim()}));
    if(kind==='difficulty'){
      const pattern=mode==='hard'?/(hardest|hard|difficult|expert|high)/i:/(easiest|easy|beginner|low)/i;
      return values.find(item=>pattern.test(item.label))?.raw||null;
    }
    if(kind==='lives'){
      const numeric=values.filter(item=>/\b\d+\b/.test(item.label));
      if(!numeric.length)return null;
      numeric.sort((a,b)=>parseInt(a.label.match(/\d+/)[0])-parseInt(b.label.match(/\d+/)[0]));
      return (mode==='hard'?numeric[0]:numeric[numeric.length-1]).raw;
    }
    if(kind==='continue'){
      const pattern=mode==='hard'?/(off|disabled|no|none)/i:/(on|enabled|yes)/i;
      return values.find(item=>pattern.test(item.label))?.raw||null;
    }
    return null;
  };
  const applyDifficultyToCore=()=>{
    const manager=window.EJS_emulator?.gameManager;
    const getOptions=manager?.functions?.getCoreOptions;
    const setVariable=manager?.functions?.setVariable;
    if(typeof getOptions!=='function'||typeof setVariable!=='function'){
      log('DIP: API de opções do core não disponível; modo não aplicado.');
      return false;
    }
    let raw='';
    try{raw=getOptions.call(manager)||''}catch(e){log('DIP: falha ao ler opções: '+(e?.message||e));return false}
    const applied=[];
    for(const line of String(raw).split(/\r?\n/)){
      if(!line.includes('; '))continue;
      const [definition,choices]=line.split('; ');
      const optionName=definition.split('|')[0].trim();
      const optionValues=choices.split('|').map(value=>value.trim()).filter(Boolean);
      const label=optionName.replace(/^[^|]*[-_]/,'').replace(/[_-]/g,' ');
      const kind=/difficulty|level/i.test(label)?'difficulty':/lives|stock|life/i.test(label)?'lives':/continue/i.test(label)?'continue':null;
      if(!kind)continue;
      const value=chooseCoreOptionValue(optionValues,difficulty,kind);
      if(!value)continue;
      try{setVariable.call(manager,optionName,value);applied.push(`${label}=${value}`)}catch(e){log('DIP: falha em '+optionName+': '+(e?.message||e))}
    }
    if(applied.length){
      log('DIP aplicado no core: '+applied.join(', '));
      window.MGA_difficulty.automatic=true;
      window.MGA_difficulty.applied=applied;
      return true;
    }
    log('DIP: este jogo/core não expôs opções de dificuldade, vidas ou continue.');
    return false;
  };

  // ---------------------------------------------------------------
  // Áudio: navegadores (principalmente iOS/Android) só liberam som depois
  // de um toque/clique. Além disso, um perfil antigo do EmulatorJS pode ter
  // volume 0 salvo. Aqui forçamos volume cheio, desmutamos e retomamos o
  // AudioContext do core em qualquer gesto do usuário. Não reiniciamos o
  // loop principal: fazer isso a cada toque pode introduzir cortes no áudio.
  // ---------------------------------------------------------------
  const MGA_VOLUME=1;
  let mgaAudioConfigured=false;
  const mgaAudioResumePending=new WeakSet();
  const resumeAudioContexts=()=>{
    const emu=window.EJS_emulator;
    const mod=emu?.gameManager?.Module||window.Module;
    const ctxs=[emu?.audioContext,mod?.SDL2?.audioContext,mod?.audioContext,window.MGA_audioCtx];
    ctxs.forEach(ctx=>{
      if(!ctx||ctx.state==='running'||mgaAudioResumePending.has(ctx))return;
      try{
        const resume=ctx.resume?.();
        if(resume?.finally){
          mgaAudioResumePending.add(ctx);
          resume.catch(()=>{}).finally(()=>mgaAudioResumePending.delete(ctx));
        }
      }catch(e){}
    });
  };
  const enableGameAudio=()=>{
    const emu=window.EJS_emulator;
    try{
      if(emu&&!mgaAudioConfigured){
        emu.muted=false;
        if(typeof emu.setVolume==='function')emu.setVolume(MGA_VOLUME);
        else emu.volume=MGA_VOLUME;
        emu.gameManager?.setVolume?.(MGA_VOLUME);
      }
    }catch(e){log('Áudio: '+(e?.message||e))}
    try{
      document.querySelectorAll('#game audio,#game video').forEach(el=>{
        if(!mgaAudioConfigured){el.muted=false;el.volume=MGA_VOLUME;}
      });
      if(emu&&!mgaAudioConfigured)mgaAudioConfigured=true;
    }catch(e){}
    resumeAudioContexts();
  };
  window.MGA_enableGameAudio=enableGameAudio;
  ['pointerdown','touchstart','touchend','keydown','click'].forEach(evt=>{
    addEventListener(evt,enableGameAudio,{passive:true});
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)enableGameAudio();
  });
  // No celular o som pode ser suspenso sozinho (chamada, notificação, tela
  // apagada) e não volta mais: o jogo continua mas o áudio fica "travado".
  // Este vigia religa o contexto de áudio assim que ele sai do ar.
  // No celular, visibilitychange/focus/pageshow já cobrem a retomada sem
  // manter um loop periódico concorrendo com o core.
  if(!isTouchDevice)setInterval(()=>{
    if(document.hidden)return;
    const emu=window.EJS_emulator;
    const mod=emu?.gameManager?.Module||window.Module;
    const suspended=[emu?.audioContext,mod?.SDL2?.audioContext,mod?.audioContext,window.MGA_audioCtx]
      .some(ctx=>ctx&&ctx.state!=='running');
    if(suspended)resumeAudioContexts();
  },2000);
  addEventListener('focus',()=>{if(!document.hidden)resumeAudioContexts()});
  addEventListener('pageshow',()=>resumeAudioContexts());

  // ---------------------------------------------------------------
  // Progresso: salva o estado completo do jogo no navegador. Cada ROM tem
  // uma chave própria, então Metal Slug, Street Fighter etc. não sobrescrevem
  // o progresso uns dos outros. O estado é salvo periodicamente e quando o
  // usuário troca de aplicativo/fecha a aba; ao voltar, é restaurado sozinho.
  // ---------------------------------------------------------------
  // ---------------------------------------------------------------
  // Gerenciador de Partidas: Sistema de Salvamento com 15 Slots + Auto-save
  // Otimizado para telas touch/mobile e persistente em IndexedDB.
  // ---------------------------------------------------------------
  const MGA_SAVE_DB='mga-progress-v1';
  const MGA_SAVE_STORE='states';
  const MGA_SAVE_KEY=`${romBase}:${core}`;
  const MGA_TOTAL_SLOTS=15;
  let mgaSaveTimer=null;
  let mgaSaveBusy=false;
  let mgaLoadBusy=false;
  let mgaInitialLoadTimer=null;
  let mgaInitialLoadStarted=false;

  const showToast=(msg,duration=2600)=>{
    const toast=document.getElementById('mga-toast');
    if(!toast)return;
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer=setTimeout(()=>toast.classList.remove('show'),duration);
  };

  const openProgressDb=()=>new Promise((resolve,reject)=>{
    if(!window.indexedDB)return reject(new Error('IndexedDB indisponível'));
    const req=indexedDB.open(MGA_SAVE_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(MGA_SAVE_STORE);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Falha no banco de progresso'));
  });

  const withProgressDb=async task=>{
    const db=await openProgressDb();
    try{return await task(db)}finally{db.close()}
  };

  const putAndVerifyRecord=async(db,key,record)=>{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(MGA_SAVE_STORE,'readwrite');
      tx.objectStore(MGA_SAVE_STORE).put(record,key);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    const persisted=await new Promise((resolve,reject)=>{
      const req=db.transaction(MGA_SAVE_STORE,'readonly').objectStore(MGA_SAVE_STORE).get(key);
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
    if(!isValidSavedRecord(persisted))throw new Error('Estado não confirmado no IndexedDB');
  };

  const getSlotKey=slot=>`${MGA_SAVE_KEY}:slot_${slot}`;

  const getLastSlot=()=>{
    const val=parseInt(localStorage.getItem(`mga_last_slot_${romBase}`)||'1',10);
    return isNaN(val)||val<1||val>MGA_TOTAL_SLOTS?1:val;
  };

  const setLastSlot=slot=>{
    try{localStorage.setItem(`mga_last_slot_${romBase}`,String(slot))}catch{}
  };

  // IndexedDB pode devolver ArrayBuffer ou Uint8Array dependendo do navegador.
  // Normalizar sempre para uma cópia independente evita salvar um buffer vazio,
  // truncado ou ligado à memória interna do EmulatorJS.
  const normalizeStateBytes=state=>{
    if(state==null)return null;
    try{
      const bytes=new Uint8Array(state);
      return bytes.byteLength?new Uint8Array(bytes):null;
    }catch{return null}
  };

  const isValidSavedRecord=record=>{
    const bytes=normalizeStateBytes(record?.state);
    if(!bytes)return false;
    return !record.stateSize||record.stateSize===bytes.byteLength;
  };

  const saveToSlot=async(slot,silent=false)=>{
    const manager=window.EJS_emulator?.gameManager;
    if(!manager||!started||mgaSaveBusy||mgaLoadBusy){
      return false;
    }
    mgaSaveBusy=true;
    const emulator=window.EJS_emulator;
    const wasPaused=!!emulator?.paused;
    try{
      // Captura um frame estável; salvar enquanto o core escreve a memória
      // podia gerar um estado incompleto e fazer o retorno parecer vazio.
      if(!wasPaused){
        if(typeof emulator?.pause==='function')emulator.pause(true);
        else manager.toggleMainLoop?.(0);
        await mgaSleep(150);
      }
      const state=normalizeStateBytes(manager.getState());
      if(!state)throw new Error('Estado vazio ou inválido');
      const now=Date.now();
      const dateStr=new Date(now).toLocaleString('pt-BR');
      const key=getSlotKey(slot);
      const record={key,slot,rom:romBase,core,savedAt:now,dateStr,state,stateSize:state.byteLength};
      await withProgressDb(db=>putAndVerifyRecord(db,key,record));
      setLastSlot(slot);
      if(!silent)showToast(`💾 Partida salva no Slot ${slot}!`);
      log(`Slot ${slot} salvo com sucesso`);
      await renderSlotsList();
      return true;
    }catch(e){
      log(`Progresso: falha ao salvar slot ${slot} (${e?.message||e})`);
      if(!silent)showToast(`❌ Falha ao salvar slot ${slot}`);
      return false;
    }finally{
      if(!wasPaused){
        try{
          if(typeof emulator?.play==='function')emulator.play(true);
          else manager.toggleMainLoop?.(1);
        }catch(e){log(`Progresso: falha ao retomar após salvar (${e?.message||e})`)}
      }
      mgaSaveBusy=false;
    }
  };

  const mgaSleep=ms=>new Promise(r=>setTimeout(r,ms));

  // O carregamento só funciona depois que o core realmente iniciou a ROM.
  // Antes disso o loadState era descartado em silêncio e a partida sumia.
  const waitForGameReady=async(timeout=25000)=>{
    const deadline=Date.now()+timeout;
    while(Date.now()<deadline){
      if(started&&window.EJS_emulator?.gameManager?.loadState)return true;
      await mgaSleep(250);
    }
    return !!(started&&window.EJS_emulator?.gameManager?.loadState);
  };

  // Se o jogo estiver pausado, o core não processa o estado restaurado.
  const resumeIfPaused=()=>{
    const emu=window.EJS_emulator;
    if(!emu)return;
    try{
      if(emu.paused){
        if(typeof emu.play==='function')emu.play();
        else emu.togglePlaying?.();
      }
    }catch(e){log('Progresso: falha ao retomar o jogo ('+(e?.message||e)+')');}
  };

  const applyStateWithRetry=async(state,label)=>{
    const bytes=normalizeStateBytes(state);
    if(!bytes)throw new Error('Estado vazio ou inválido');
    for(let attempt=1;attempt<=3;attempt++){
      const manager=window.EJS_emulator?.gameManager;
      if(manager?.loadState){
        const emulator=window.EJS_emulator;
        try{
          // O GameManager grava o estado em /game.state e o core só o aplica
          // enquanto o loop está processando frames. A sequência anterior
          // pausava o core antes do load e, em alguns celulares, o loop não
          // voltava a processar o estado: o slot aparecia como carregado, mas
          // a partida permanecia congelada ou voltava ao início.
          manager.loadState(new Uint8Array(bytes));
          if(emulator?.paused){
            if(typeof emulator.play==='function')emulator.play(true);
            else manager.toggleMainLoop?.(1);
          }
          await mgaSleep(1500);
          await mgaSleep(250);
          log(`${label}: estado aplicado (tentativa ${attempt})`);
          return true;
        }catch(e){
          try{
            if(emulator?.paused&&typeof emulator?.play==='function')emulator.play(true);
            else if(emulator?.paused)manager.toggleMainLoop?.(1);
          }catch{}
          log(`${label}: tentativa ${attempt} falhou (${e?.message||e})`);
        }
      }
      await mgaSleep(800);
    }
    return false;
  };

  const readSlotRecord=async key=>{
    return withProgressDb(db=>new Promise((resolve,reject)=>{
      const req=db.transaction(MGA_SAVE_STORE,'readonly').objectStore(MGA_SAVE_STORE).get(key);
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    }));
  };

  const loadFromSlot=async(slot,silent=false)=>{
    if(mgaLoadBusy||mgaSaveBusy){
      if(!silent)showToast('⏳ Aguarde a operação de save terminar.',3000);
      return false;
    }
    mgaLoadBusy=true;
    try{
      // Um load manual tem prioridade. Sem cancelar o timer, o auto-load
      // agendado no início podia aplicar o slot automático logo depois e
      // substituir silenciosamente o slot escolhido pelo jogador.
      if(mgaInitialLoadTimer){
        clearTimeout(mgaInitialLoadTimer);
        mgaInitialLoadTimer=null;
      }
      mgaInitialLoadStarted=true;
      const saved=await readSlotRecord(getSlotKey(slot));
      if(!isValidSavedRecord(saved)){
        return false;
      }
      if(!silent)showToast(`⏳ Restaurando o Slot ${slot}...`,4000);
      const ready=await waitForGameReady();
      if(!ready){
        log(`Slot ${slot}: o jogo não iniciou a tempo para restaurar`);
        return false;
      }
      const ok=await applyStateWithRetry(saved.state,`Slot ${slot}`);
      if(!ok){
        if(!silent)showToast(`❌ Não foi possível carregar o Slot ${slot}. Tente novamente.`,4000);
        return false;
      }
      setLastSlot(slot);
      if(!silent)showToast(`🎮 Partida do Slot ${slot} carregada!`);
      log(`Slot ${slot} restaurado`);
      closeSavesModal();
      return true;
    }catch(e){
      log(`Progresso: falha ao carregar slot ${slot} (${e?.message||e})`);
      if(!silent)showToast(`❌ Falha ao carregar slot ${slot}`);
      return false;
    }finally{mgaLoadBusy=false}
  };

  const deleteSlot=async(slot)=>{
    try{
      const key=getSlotKey(slot);
      await withProgressDb(db=>new Promise((resolve,reject)=>{
        const tx=db.transaction(MGA_SAVE_STORE,'readwrite');
        tx.objectStore(MGA_SAVE_STORE).delete(key);
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      }));
      showToast(`🗑 Slot ${slot} apagado.`);
      await renderSlotsList();
      return true;
    }catch(e){
      log(`Progresso: falha ao apagar slot ${slot} (${e?.message||e})`);
      return false;
    }
  };

  const saveProgress=async(silent=false)=>{
    const manager=window.EJS_emulator?.gameManager;
    if(!manager||!started||mgaSaveBusy||mgaLoadBusy)return false;
    mgaSaveBusy=true;
    const emulator=window.EJS_emulator;
    const wasPaused=!!emulator?.paused;
    try{
      if(!wasPaused){
        if(typeof emulator?.pause==='function')emulator.pause(true);
        else manager.toggleMainLoop?.(0);
        await mgaSleep(150);
      }
      const state=normalizeStateBytes(manager.getState());
      if(!state)throw new Error('Estado vazio ou inválido');
      const now=Date.now();
      const dateStr=new Date(now).toLocaleString('pt-BR');
      await withProgressDb(db=>putAndVerifyRecord(db,MGA_SAVE_KEY,{state,stateSize:state.byteLength,savedAt:now,dateStr}));
      if(!silent)showToast('💾 Progresso salvo automaticamente');
      return true;
    }catch(e){log('Progresso: falha ao salvar auto '+(e?.message||e));return false}
    finally{
      if(!wasPaused){
        try{
          if(typeof emulator?.play==='function')emulator.play(true);
          else manager.toggleMainLoop?.(1);
        }catch(e){log('Progresso: falha ao retomar após auto-save ('+(e?.message||e)+')')}
      }
      mgaSaveBusy=false
    }
  };

  const loadProgress=async()=>{
    if(mgaLoadBusy||mgaSaveBusy)return false;
    if(mgaInitialLoadStarted)return false;
    mgaInitialLoadStarted=true;
    mgaLoadBusy=true;
    try{
      const saved=await readSlotRecord(MGA_SAVE_KEY);
      if(!isValidSavedRecord(saved))return false;
      const ready=await waitForGameReady();
      if(!ready){
        log('Progresso: jogo não iniciou a tempo para restaurar o save automático');
        return false;
      }
      const ok=await applyStateWithRetry(saved.state,'Save automático');
      if(!ok){
        return false;
      }
      log('Progresso anterior restaurado');
      return true;
    }catch(e){log('Progresso: nenhum save auto restaurado ('+(e?.message||e)+')');return false}
    finally{mgaLoadBusy=false}
  };

  const saveAndExit=async()=>{
    try{
      closeSavesModal?.();
      showToast('💾 Salvando antes de sair...',10000);
      const deadline=Date.now()+5000;
      while(mgaSaveBusy&&Date.now()<deadline)await mgaSleep(100);
      const ok=await saveProgress(true);
      parent.postMessage({
        type:ok?'mga-emulator-save-complete':'mga-emulator-save-failed',
        message:ok?'Partida salva com sucesso.':'Não foi possível salvar a partida.'
      },location.origin);
    }catch(e){
      log('Progresso: falha ao salvar antes de sair '+(e?.message||e));
      parent.postMessage({type:'mga-emulator-save-failed',message:'Falha ao salvar antes de sair.'},location.origin);
    }
  };
  window.addEventListener('message',e=>{
    if(e.source!==window.parent||e.origin!==location.origin)return;
    if(e.data?.type==='mga-request-save-exit')saveAndExit();
  });

  const renderSlotsList=async()=>{
    const container=document.getElementById('mga-slots-list');
    if(!container)return;
    container.innerHTML='<div style="color:#00e5ff;font-size:12px;padding:8px;">Carregando slots...</div>';
    try{
      const db=await openProgressDb();
      const recordsMap={};
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(MGA_SAVE_STORE,'readonly');
        const store=tx.objectStore(MGA_SAVE_STORE);
        const req=store.openCursor();
        req.onsuccess=e=>{
          const cursor=e.target.result;
          if(cursor){
            const key=String(cursor.key);
            if(key.startsWith(`${MGA_SAVE_KEY}:slot_`)){
              const slotNum=parseInt(key.split(':slot_')[1],10);
              recordsMap[slotNum]=cursor.value;
            }else if(key===MGA_SAVE_KEY){
              recordsMap['auto']=cursor.value;
            }
            cursor.continue();
          }else{
            resolve();
          }
        };
        req.onerror=()=>reject(req.error);
      });
      db.close();

      container.innerHTML='';

      // Slot Automático
      const autoSave=recordsMap['auto'];
      const autoCard=document.createElement('div');
      autoCard.className='mga-slot-card'+(autoSave?' has-data':'');
      autoCard.style.borderLeft='3px solid #ffbb00';
      autoCard.innerHTML=`
        <div class="mga-slot-left">
          <span class="mga-slot-badge" style="color:#ffbb00">⚡ SLOT AUTOMÁTICO (Auto-Save)</span>
          <span class="mga-slot-time">${autoSave?('💾 '+ (autoSave.dateStr || new Date(autoSave.savedAt).toLocaleString('pt-BR'))):'Nenhum save automático ainda'}</span>
        </div>
        <div class="mga-slot-btns">
          <button class="mga-btn-load" type="button" ${autoSave?'':'disabled'}>▶ Carregar</button>
        </div>
      `;
      autoCard.querySelector('.mga-btn-load').onclick=()=>loadProgress();
      container.appendChild(autoCard);

      // Slots 1 a 15
      for(let i=1;i<=MGA_TOTAL_SLOTS;i++){
        const item=recordsMap[i];
        const card=document.createElement('div');
        card.className='mga-slot-card'+(item?' has-data':'');
        const numStr=i<10?('0'+i):(''+i);
        card.innerHTML=`
          <div class="mga-slot-left">
            <span class="mga-slot-badge">SLOT ${numStr}</span>
            <span class="mga-slot-time">${item?('💾 '+(item.dateStr || new Date(item.savedAt).toLocaleString('pt-BR'))):'Vazio — livre para salvar'}</span>
          </div>
          <div class="mga-slot-btns">
            <button class="mga-btn-save" type="button" title="Salvar progresso atual no slot ${i}">💾 Salvar</button>
            <button class="mga-btn-load" type="button" title="Carregar progresso do slot ${i}" ${item?'':'disabled'}>▶ Carregar</button>
            <button class="mga-btn-del" type="button" title="Excluir save do slot ${i}" ${item?'':'disabled'}>🗑</button>
          </div>
        `;
        card.querySelector('.mga-btn-save').onclick=()=>saveToSlot(i);
        card.querySelector('.mga-btn-load').onclick=()=>loadFromSlot(i);
        card.querySelector('.mga-btn-del').onclick=()=>{
          if(confirm(`Deseja apagar o save do Slot ${i}?`))deleteSlot(i);
        };
        container.appendChild(card);
      }
    }catch(e){
      container.innerHTML=`<div style="color:#ff2b6d;font-size:12px;padding:8px;">Erro ao listar saves: ${esc(e?.message||e)}</div>`;
    }
  };

  const openSavesModal=()=>{
    const modal=document.getElementById('mga-saves-modal');
    if(!modal)return;
    modal.classList.add('open');
    renderSlotsList();
    if(screen.orientation?.lock){
      screen.orientation.lock("landscape").catch(()=>{});
    }
  };

  const closeSavesModal=()=>{
    const modal=document.getElementById('mga-saves-modal');
    if(modal)modal.classList.remove('open');
  };

  // O listener do botão já foi instalado no início do script. Este callback
  // apenas conecta a listagem dos 15 slots quando ela estiver disponível.
  window.MGA_refreshSaves=renderSlotsList;
  // Se o usuário abriu o painel antes do core terminar a inicialização, o
  // listener antecipado já exibiu o modal, mas ainda não havia uma função de
  // listagem registrada. Preenche o painel assim que esta rotina fica pronta.
  if(earlySavesModal?.classList.contains('open'))renderSlotsList();

  // Wire up saves controls
  const btnQuickSave=document.getElementById('mga-btn-quick-save');
  const btnQuickLoad=document.getElementById('mga-btn-quick-load');
  const btnReturn=document.getElementById('mga-btn-return');
  if(btnReturn)btnReturn.addEventListener('click',closeSavesModal);

  if(btnQuickSave)btnQuickSave.addEventListener('click',()=>saveToSlot(getLastSlot()));
  if(btnQuickLoad)btnQuickLoad.addEventListener('click',()=>loadFromSlot(getLastSlot()));

  // ===============================================================
  // MELHORIAS MOBILE: Haptic Feedback, Pausa Rápida, Opacidade & Anti-Gestos
  // ===============================================================
  let mgaHapticEnabled = localStorage.getItem('mga_haptic_enabled') !== '0';
  const triggerHaptic = (ms = 14) => {
    if (!mgaHapticEnabled || !navigator.vibrate) return;
    try { navigator.vibrate(ms); } catch (_) {}
  };

  const btnHaptic = document.getElementById('btn-haptic');
  const updateHapticUI = () => {
    if (!btnHaptic) return;
    btnHaptic.textContent = mgaHapticEnabled ? '📳' : '📳✕';
    btnHaptic.style.color = mgaHapticEnabled ? '#00e5ff' : '#777';
    btnHaptic.title = mgaHapticEnabled ? 'Vibração: Ativada' : 'Vibração: Desativada';
  };
  updateHapticUI();
  if (btnHaptic) {
    btnHaptic.addEventListener('click', () => {
      mgaHapticEnabled = !mgaHapticEnabled;
      try { localStorage.setItem('mga_haptic_enabled', mgaHapticEnabled ? '1' : '0'); } catch (_) {}
      updateHapticUI();
      if (mgaHapticEnabled) triggerHaptic(20);
      showToast(mgaHapticEnabled ? '📳 Vibração ativada' : '📳 Vibração desativada');
    });
  }

  // Opacidade rápida dos controles touch no celular (para não cobrir o jogo)
  const PAD_OPACITIES = [
    { label: '👁 100%', val: '1.0' },
    { label: '👁 75%', val: '0.75' },
    { label: '👁 50%', val: '0.50' },
    { label: '👁 25%', val: '0.25' }
  ];
  let currentOpIdx = parseInt(localStorage.getItem('mga_pad_op_idx') || '1', 10);
  if (isNaN(currentOpIdx) || currentOpIdx < 0 || currentOpIdx >= PAD_OPACITIES.length) currentOpIdx = 1;
  const applyPadOpacity = (idx, silent = false) => {
    currentOpIdx = idx % PAD_OPACITIES.length;
    const item = PAD_OPACITIES[currentOpIdx];
    document.documentElement.style.setProperty('--mga-pad-opacity', item.val);
    const btnOp = document.getElementById('btn-opacity');
    if (btnOp) btnOp.textContent = item.label;
    try { localStorage.setItem('mga_pad_op_idx', String(currentOpIdx)); } catch (_) {}
    if (!silent) showToast('Controles: ' + item.label.replace('👁 ', '') + ' de opacidade');
  };
  applyPadOpacity(currentOpIdx, true);
  const btnOpacity = document.getElementById('btn-opacity');
  if (btnOpacity) {
    btnOpacity.addEventListener('click', () => {
      applyPadOpacity(currentOpIdx + 1);
      triggerHaptic(12);
    });
  }

  // Pausa rápida para celular (atender ligação / notificações sem perder vida)
  const btnPause = document.getElementById('btn-pause');
  if (btnPause) {
    btnPause.addEventListener('click', () => {
      const emu = window.EJS_emulator;
      if (!emu || !started) {
        return;
      }
      emu.togglePlaying?.();
      const isPaused = !!emu.paused;
      btnPause.textContent = isPaused ? '▶' : '⏸';
      btnPause.title = isPaused ? 'Retomar Emulação' : 'Pausar Emulação';
      btnPause.style.color = isPaused ? '#ffbb00' : '#00e5ff';
      showToast(isPaused ? '⏸ Jogo Pausado' : '▶ Jogo Retomado');
      triggerHaptic(20);
    });
  }

  // Hooking de toque no Gamepad touch para Haptic Feedback imediato
  document.addEventListener('touchstart', (e) => {
    const target = e.target;
    if (target && target.closest && target.closest('.ejs_virtualGamepad_parent, .ejs_dpad_main, .ejs_virtualGamepad_button, .mga-btn-action, .mga-ctrl-btn')) {
      triggerHaptic(15);
    }
    requestWakeLock();
  }, { passive: true, capture: true });

  window.MGA_saveProgress=()=>saveProgress(false);
  window.MGA_openSaves=openSavesModal;
  window.MGA_saveToSlot=saveToSlot;
  window.MGA_loadFromSlot=loadFromSlot;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)saveProgress(true);
  });
  addEventListener('pagehide',()=>saveProgress(true),{capture:true});


  window.EJS_onGameStart=()=>{
    if(started)return;
    started=true;
    attempting=false;
    if(retryTimer)clearTimeout(retryTimer);
    if(startWatchdog)clearTimeout(startWatchdog);
    // Um perfil antigo do EmulatorJS pode restaurar o gamepad como oculto.
    // Em dispositivos touch, os controles precisam aparecer ao iniciar;
    // em desktop, preservamos a experiência sem sobreposição.
    const touchDevice=navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches;
    if(touchDevice){
      try{window.EJS_emulator?.toggleVirtualGamepad?.(true)}catch(e){log('Gamepad touch: '+(e?.message||e))}
      try{
        const pad=window.EJS_emulator?.virtualGamepad;
        if(pad){pad.style.display='';pad.style.opacity='';}
        // Remove qualquer sobreposição do menu do EmulatorJS que fique
        // acima dos controles de toque.
        document.querySelectorAll('#game>.ejs_virtualGamepad_open').forEach(el=>el.remove());
      }catch(e){log('Ajuste do gamepad touch: '+(e?.message||e))}
    }
    hide();
    log('Arcade/FBNeo iniciou o jogo');
    [0,250,1000].forEach(ms=>setTimeout(fitMobileGameViewport,ms));
    applyDifficultyToCore();
    // Garante o som logo ao entrar no jogo (e de novo depois, pois o core
    // cria o contexto de áudio poucos instantes após o start).
    enableGameAudio();
    [300,1200].forEach(ms=>setTimeout(enableGameAudio,ms));
    // Restaura o último ponto em qualquer dispositivo. O core precisa de um
    // pouco mais de tempo no celular para criar o estado antes do loadState;
    // deixar esse caminho fora do touch fazia o jogo reabrir sempre do zero.
    mgaInitialLoadTimer=setTimeout(()=>{
      mgaInitialLoadTimer=null;
      loadProgress();
    },isTouchDevice?3500:2500);
    // Mantém um checkpoint periódico em qualquer dispositivo. A captura pausa
    // o core por poucos milissegundos e evita depender de pagehide no celular.
    if(mgaSaveTimer)clearInterval(mgaSaveTimer);
    mgaSaveTimer=setInterval(()=>{if(!document.hidden)saveProgress(true)},120000);
    // O shader só pode ser ativado depois de o contexto gráfico do core existir.
    setTimeout(applyPixelEnhancement,0);
    requestWakeLock();

    try{
      const fs=window.EJS_emulator?.gameManager?.FS;
      if(fs){
        const expected=biosName||'BIOS';
        const checks=[
          `/${expected}`,
          '/home/web_user/retroarch/userdata/system/'+expected,
          '/home/web_user/retroarch/userdata/system/fbneo/'+expected
        ];
        const found=checks.filter(p=>{
          try{fs.stat(p);return true}catch{return false}
        });
        log(expected+' encontrado no FS: '+(found.length?found.join(' | '):'não exposto pelo wrapper'));
      }
    }catch(e){
      log('Diagnóstico FS: '+(e?.message||e));
    }

    try{parent.postMessage({type:'mga-emulator-started'},location.origin)}catch{}
  };

  // Inicia somente uma vez. O clique duplicado era capaz de chamar
  // toggleMainLoop antes de o módulo interno do EmulatorJS estar pronto.
  const findStartButton=()=>{
    // Só o botão de início real do EmulatorJS (tela de start), nunca os
    // botões da barra de controles (play/pause etc.), que chamam
    // toggleMainLoop antes de o core existir.
    const real=document.querySelector(
      '.ejs_start_button,.ejs_startbutton,#ejs_start_button,.ejs_start_screen button,[class*="ejs-start"] button,[class*="ejs_start"] button'
    );
    if(real) return real;
    const els=[...document.querySelectorAll('.ejs_start_screen button,.ejs_start_screen [role="button"]')];
    return els.find(e=>/^\s*(start game|start|play)\s*$/i.test((e.textContent||'').trim()))||null;
  };

  const tryStart=()=>{
    if(started||attempting)return false;

    // Com início automático ligado não clicamos em nada: o EmulatorJS
    // inicia sozinho e qualquer clique cairia na barra de controles.
    if(window.EJS_startOnLoaded){
      log('Início automático ativo; nenhum clique sintético será feito.');
      return false;
    }

    const b=findStartButton();
    if(!b){
      log('Botão de início real do EmulatorJS ainda não existe.');
      return false;
    }

    attempting=true;
    b.click();
    log('Botão de início real acionado uma única vez');

    setTimeout(()=>{
      if(!started){
        attempting=false;
        if(!window.EJS_startOnLoaded)showManualStart();
        log('O core ainda não iniciou; nova tentativa poderá ser feita manualmente.');
      }
    },5000);

    return true;
  };

  const showManualStart=()=>{
    if(!started){
      status.style.display='none';
      manual.style.display='block';
      log('Aguardando clique do usuário para iniciar o Arcade/FBNeo');
    }
  };

  manual.addEventListener('click',()=>{
    manual.style.display='none';
    const b=findStartButton();
    if(b&&!started){
      attempting=true;
      b.click();
      log('Início manual: botão real do EmulatorJS acionado');
      setTimeout(()=>{if(!started)attempting=false;},5000);
    }else{
      log('Sem botão de início real; aguardando o início automático do core.');
      if(!started) showManualStart();
    }
  });

  // Não usamos listener global de clique: ele podia capturar o clique
  // sintético do EmulatorJS e iniciar o core duas vezes.

  const hideEmulatorUi=()=>{
    document.querySelectorAll('#game button,#game [role="button"],#game .ejs_menu_bar,#game .ejs_menu,#game .ejs_context_menu,#game .ejs_volume_parent').forEach(el=>{
      el.style.display='none';
    });
  };
  let hideUiFrame=0;
  const scheduleHideEmulatorUi=()=>{
    if(hideUiFrame)return;
    hideUiFrame=requestAnimationFrame(()=>{
      hideUiFrame=0;
      hideEmulatorUi();
    });
  };

  window.EJS_ready=()=>{
    ready=true;
    log(window.EJS_startOnLoaded
      ? 'EmulatorJS pronto; o jogo será iniciado automaticamente'
      : 'EmulatorJS pronto; aguardando toque para iniciar no celular');
    // No celular, tente o botão interno apenas se ele já existir; caso
    // contrário, mostre o botão manual sem manter uma tentativa concorrente.
    setTimeout(()=>{
      if(!started&&!attempting&&!window.EJS_startOnLoaded){
        const didStart=tryStart();
        if(!didStart)showManualStart();
      }
    },700);
    hideEmulatorUi();
    setTimeout(hideEmulatorUi,300);
    setTimeout(hideEmulatorUi,1500);
  };

  addEventListener('error',e=>{
    log('window.error: '+(e.message||'erro mascarado pelo CDN'));
    if(attempting&&!started&&retriesLeft>0&&!window.EJS_startOnLoaded){
      retriesLeft--;
      attempting=false;
      log('Possível corrida de inicialização — tentando novamente em 2.5s ('+retriesLeft+' restantes)');
      retryTimer=setTimeout(()=>{
        if(!started)tryStart();
      },2500);
    }
  });

  addEventListener('unhandledrejection',e=>{
    log('unhandledrejection: '+(e.reason?.message||e.reason));
  });

  new MutationObserver(scheduleHideEmulatorUi).observe(document.getElementById('game'),{childList:true,subtree:true});

  startWatchdog=setTimeout(()=>{
    if(!ready&&!started){
      fail('Arcade não carregou em 30s. Verifique a ROM, o BIOS e o endpoint de download.');
    }
  },30000);

  setTimeout(()=>{
    if(ready&&!started){
      fail('EmulatorJS ficou pronto, mas o core Arcade (FBNeo) não iniciou a ROM. Confirme o romset e o BIOS.');
    }
  },45000);

  // Os controles de teclado e gamepad são tratados pelo próprio EmulatorJS
  // através de EJS_defaultControls (mapa acima). Nenhum remapeamento manual.

  const script=document.createElement('script');
  script.src=window.EJS_pathtodata+'loader.js';
  script.async=true;
  script.onerror=()=>{
    log('loader.js local falhou — tentando fallback pelo CDN oficial.');
    window.EJS_pathtodata='https://cdn.emulatorjs.org/'+EJS_PINNED_VERSION+'/data/';
    const fallback=document.createElement('script');
    fallback.src=window.EJS_pathtodata+'loader.js';
    fallback.async=true;
    fallback.crossOrigin='anonymous';
    fallback.onerror=()=>fail('Não foi possível carregar o EmulatorJS (local nem CDN).');
    document.head.appendChild(fallback);
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
