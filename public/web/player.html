<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Master Games Arcade - Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
    #game{position:relative;width:var(--mga-vw,100dvw);height:var(--mga-vh,100dvh);background:#000;display:grid;place-items:center;overflow:hidden;--video-brightness:1;--video-contrast:1;--video-saturation:1}
    /* Tira os elementos do EmulatorJS do fluxo: senão o canvas cresce a cada
       medição do ResizeObserver e a tela fica preta. */
    #game>*{position:absolute;top:0;left:0;width:100%;height:100%;max-width:100vw;max-height:100vh}
    #game canvas,#game video{max-width:100vw!important;max-height:100vh!important;object-fit:contain}
    #game canvas,#game video{image-rendering:pixelated;image-rendering:crisp-edges;filter:brightness(var(--video-brightness)) contrast(var(--video-contrast)) saturate(var(--video-saturation));}
    body.video-aspect-43 #game canvas,body.video-aspect-43 #game video{width:min(100vw,133.333vh)!important;height:min(75vw,100vh)!important;object-fit:contain}
    /* Preenche a viewport inteira. Em telas widescreen o arcade 4:3 é
       esticado horizontalmente para eliminar as margens pretas laterais. */
    body.video-stretch #game .ejs_canvas_parent,body.video-stretch #game canvas,body.video-stretch #game video{position:absolute!important;inset:0!important;width:100dvw!important;height:100dvh!important;max-width:none!important;max-height:none!important;object-fit:fill!important}
    body.video-integer #game canvas,body.video-integer #game video{image-rendering:pixelated;transform:translateZ(0)}
    body.video-scanlines #game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:99998;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,.16) 4px);mix-blend-mode:multiply}
    body.video-vignette #game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:99997;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42) 100%)}
    body.video-amber #game canvas,body.video-amber #game video{filter:brightness(var(--video-brightness)) contrast(calc(var(--video-contrast) * 1.08)) saturate(calc(var(--video-saturation) * .82)) sepia(.16)}
    body.video-cool #game canvas,body.video-cool #game video{filter:brightness(var(--video-brightness)) contrast(var(--video-contrast)) saturate(calc(var(--video-saturation) * 1.12)) hue-rotate(8deg)}
    body.video-soft #game canvas,body.video-soft #game video{image-rendering:auto;filter:brightness(var(--video-brightness)) contrast(.96) saturate(var(--video-saturation));}
    @media (min-resolution:2dppx){#game canvas,#game video{image-rendering:pixelated}}
    @media (orientation:portrait){body.video-auto #game canvas,body.video-auto #game video{max-width:100vw;max-height:75vh;object-fit:contain}}
    /* O launcher mostra apenas o jogo, não a interface do emulador. */
    #game button,#game [role="button"],#game .ejs_menu_bar,#game .ejs_menu,
    #game .ejs_context_menu,#game .ejs_volume_parent,#game [class*="ejs-menu"],
    #game [class*="ejs_context"],#game [class*="ejs-start"]{
      display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important
    }
    #status{position:fixed;inset:0;z-index:99999;display:grid;place-items:start center;background:linear-gradient(rgba(0,0,0,.94) 0,rgba(0,0,0,.94) 92px,transparent 92px);color:#00e5ff;font:700 16px monospace;text-align:center;padding:70px 24px 24px;box-sizing:border-box;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 8px #000,0 0 14px #00e5ff}
    #debug{position:fixed;left:10px;right:10px;bottom:10px;z-index:100000;max-height:42vh;overflow:auto;display:none;background:rgba(0,0,0,.9);border:1px solid #00e5ff;color:#00e5ff;padding:10px;box-sizing:border-box;font:12px/1.35 monospace;white-space:pre-wrap}
    #manual-start{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:100001;display:none;background:#08000f;color:#00e5ff;border:2px solid #00e5ff;box-shadow:0 0 18px #00e5ff66;padding:16px 24px;font:700 16px monospace;cursor:pointer}
    #difficulty-setup{position:fixed;inset:0;z-index:100002;display:grid;place-items:center;background:linear-gradient(rgba(3,0,6,.68),rgba(3,0,6,.82)),url('/assets/game-loading-art.png') center/cover no-repeat;color:#fff;padding:24px;box-sizing:border-box;font-family:monospace}
    #difficulty-setup .difficulty-card{width:min(560px,100%);border:1px solid #00e5ff55;background:rgba(5,0,11,.98);box-shadow:0 0 24px #00e5ff22;padding:24px;box-sizing:border-box;text-align:center}
    #difficulty-setup h1{margin:0 0 10px;color:#00e5ff;font-size:20px}
    #difficulty-setup p{margin:0 auto 20px;color:#aaa;font-size:12px;line-height:1.5;max-width:470px}
    #difficulty-setup .difficulty-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    #difficulty-setup button{min-width:190px;padding:14px 18px;background:#08000f;font:bold 13px monospace;cursor:pointer}
    #difficulty-setup button[data-difficulty=easy]{border:1px solid #39ff88;color:#39ff88}
    #difficulty-setup button[data-difficulty=hard]{border:1px solid #ff2b6d;color:#ff6f9e}
    #difficulty-setup button.selected{box-shadow:0 0 14px currentColor}
    #difficulty-setup small{font-weight:normal;color:#bbb}
    #difficulty-setup .config-section{margin:18px auto 0;padding-top:14px;border-top:1px solid #ffffff18;text-align:left;max-width:470px}
    #difficulty-setup .config-title{color:#00e5ff;font-size:10px;letter-spacing:1px;margin-bottom:9px}
    #difficulty-setup .config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;color:#ccc;font-size:11px}
    #difficulty-setup label{display:flex;align-items:center;gap:7px;padding:7px;background:#ffffff08;border:1px solid #ffffff12;cursor:pointer}
    #difficulty-setup select{width:100%;padding:7px;background:#08000f;border:1px solid #00e5ff55;color:#fff;font:11px monospace}
    #difficulty-setup .controls-note{color:#999;font-size:10px;line-height:1.45}
    #difficulty-setup .mobile-only{display:none}
    @media (hover:none) and (pointer:coarse){#difficulty-setup .mobile-only{display:flex}}
    /* ===== Controles touch (layout de celular) =====
       Tamanhos derivados da largura/altura da tela para nunca ficarem
       pequenos demais no celular nem gigantes no tablet. */
    #game .ejs_virtualGamepad_parent{
      --mga-dpad:clamp(112px,34vw,184px);
      --mga-btn:clamp(48px,13.5vw,74px);
      --mga-gap:clamp(6px,2.2vw,14px);
      --mga-side:max(12px,env(safe-area-inset-left));
      --mga-floor:max(14px,env(safe-area-inset-bottom));
      z-index:20;top:auto!important;bottom:0;height:auto;pointer-events:none
    }
    #game .ejs_virtualGamepad_parent>div{pointer-events:auto}
    #game .ejs_virtualGamepad_top{display:none}
    #game .ejs_virtualGamepad_button{
      touch-action:none;border:2px solid rgba(0,229,255,.6);background:rgba(4,10,20,.42);
      color:#eaffff;text-shadow:0 0 6px rgba(0,0,0,.9);box-shadow:0 0 12px rgba(0,229,255,.18);
      backdrop-filter:blur(2px);-webkit-tap-highlight-color:transparent;transition:background .08s,transform .08s
    }
    #game .ejs_virtualGamepad_button_down{background:rgba(0,229,255,.5)!important;border-color:#fff!important;transform:scale(.94)}
    /* Modo leve: reduz composição GPU em celulares sem alterar o layout dos controles. */
    @media (hover:none) and (pointer:coarse){
      #game .ejs_virtualGamepad_button,
      .mga-ctrl-btn,#btn-save,#btn-fullscreen,#mga-saves-modal{
        backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;text-shadow:none;transition:none
      }
      #game .ejs_virtualGamepad_button{border-width:1px}
    }
    /* Direcional */
    #game .ejs_virtualGamepad_left{bottom:var(--mga-floor);left:var(--mga-side);width:var(--mga-dpad);height:var(--mga-dpad)}
    #game .ejs_dpad_main{opacity:.88}
    /* Quatro botões em diamante (B A Y X), com espaço para o dedo */
    #game .ejs_virtualGamepad_right{
      bottom:var(--mga-floor);right:var(--mga-side);
      width:calc(var(--mga-btn)*3 + var(--mga-gap)*2);
      height:calc(var(--mga-btn)*2 + var(--mga-gap))
    }
    #game .ejs_virtualGamepad_right .ejs_virtualGamepad_button{
      position:absolute;width:var(--mga-btn)!important;height:var(--mga-btn)!important;
      line-height:var(--mga-btn)!important;font-size:calc(var(--mga-btn)*.42)!important;
      right:auto!important;bottom:auto!important
    }
    #game .ejs_virtualGamepad_right .b_b{left:0!important;top:calc(50% - var(--mga-btn)/2)!important}
    #game .ejs_virtualGamepad_right .b_a{left:calc(var(--mga-btn) + var(--mga-gap))!important;top:0!important}
    #game .ejs_virtualGamepad_right .b_y{left:calc(var(--mga-btn) + var(--mga-gap))!important;top:calc(var(--mga-btn) + var(--mga-gap))!important}
    #game .ejs_virtualGamepad_right .b_x{left:calc((var(--mga-btn) + var(--mga-gap))*2)!important;top:calc(50% - var(--mga-btn)/2)!important}
    /* CRÉDITO e START ficam numa faixa acima do direcional, sem disputar
       espaço com ele em telas estreitas. */
    #game .ejs_virtualGamepad_bottom{
      left:50%!important;right:auto!important;margin-left:0!important;transform:translateX(-50%);
      width:auto!important;height:auto!important;display:flex;gap:clamp(8px,3vw,16px);
      bottom:calc(var(--mga-floor) + var(--mga-dpad) + 12px)
    }
    #game .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button{
      position:relative!important;left:auto!important;top:auto!important;
      min-width:clamp(88px,26vw,124px);height:48px!important;line-height:48px!important;
      font-size:12px!important;letter-spacing:1px;padding:0 14px;border-radius:24px;box-sizing:border-box
    }
    /* O botão de menu do EmulatorJS é filho direto de #game e herdava
       width/height 100% da regra acima, cobrindo a tela inteira com
       z-index 999 e engolindo todos os toques (direção e crédito).
       Ele não é usado pelo launcher: fica desativado. */
    #game>.ejs_virtualGamepad_open{display:none!important;pointer-events:none!important;width:24px!important;height:24px!important;top:5px!important;left:auto!important;right:5px!important}
    @media (hover:none) and (pointer:coarse){
      #game .ejs_virtualGamepad_parent{display:block!important}
    }
    /* Retrato no celular: o jogo ocupa a área de cima (o máximo possível) e os
       controles ganham uma faixa própria embaixo, sem cobrir a imagem.
       As medidas ficam em variáveis para o canvas e os botões usarem o mesmo
       cálculo e nunca se sobreporem. */
    @media (hover:none) and (pointer:coarse) and (orientation:portrait){
      body{
        --mga-p-dpad:clamp(112px,34vw,184px);
        --mga-p-floor:max(14px,env(safe-area-inset-bottom));
        --mga-p-top:calc(max(8px,env(safe-area-inset-top)) + 44px);
        --mga-p-band:calc(var(--mga-p-dpad) + var(--mga-p-floor) + 66px);
        --mga-p-game:calc(100dvh - var(--mga-p-top) - var(--mga-p-band));
        --mga-p-scale:1;
      }
      body.mga-embedded{
        --mga-p-top:calc(max(8px,env(safe-area-inset-top)) + var(--mga-header-h) + 44px);
      }
      #game .ejs_virtualGamepad_parent{
        position:fixed!important;left:0!important;right:0!important;bottom:0!important;
        top:auto!important;height:var(--mga-p-band);
        background:linear-gradient(rgba(3,0,8,0),rgba(3,0,8,.72) 28%,rgba(3,0,8,.94))
      }
      /* Move o contêiner inteiro do jogo. Antes apenas o canvas recebia top,
         mas o wrapper do EmulatorJS continuava preso no topo da viewport. */
      #game{
        position:absolute!important;top:var(--mga-p-top)!important;left:0!important;
        width:100dvw!important;height:var(--mga-p-game)!important;
      }
      /* CRÉDITO/START numa linha própria, acima do direcional e dos botões */
      #game .ejs_virtualGamepad_bottom{
        bottom:calc(var(--mga-p-floor) + var(--mga-p-dpad) + 10px)!important
      }
      #game .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button{
        min-width:clamp(96px,30vw,140px);height:46px!important;line-height:46px!important
      }
      #game .ejs_canvas_parent{
        top:0!important;bottom:auto!important;left:0!important;
        width:100dvw!important;height:var(--mga-p-game)!important;
        max-width:100dvw!important;max-height:none!important;transform:none!important
      }
      body.video-stretch #game canvas,body.video-stretch #game video,
      #game canvas,#game video{
        top:0!important;bottom:auto!important;left:0!important;
        width:100dvw!important;height:calc(100% / var(--mga-p-scale))!important;
        max-width:100dvw!important;max-height:none!important;
        /* Estica apenas o canvas, não o wrapper, evitando a escala dupla. */
        object-fit:fill!important;transform:scaleY(var(--mga-p-scale));transform-origin:top left
      }
    }
    /* Paisagem no celular: o jogo ocupa 100% da altura da tela (100dvh)
       para maximizar o tamanho da tela do jogo em celulares horizontais.
       Os controles e botões de CRÉDITO/START flutuam nas laterais e na base. */
    @media (hover:none) and (pointer:coarse) and (orientation:landscape){
      body{
        --mga-l-strip:calc(38px + max(8px, env(safe-area-inset-bottom)));
        --mga-l-game:calc(100dvh - var(--mga-l-strip));
      }
      #game{
        position:fixed!important;inset:0!important;
        width:100dvw!important;height:100dvh!important;
        overflow:visible!important;transform:none!important
      }
      #game .ejs_virtualGamepad_parent{
        position:absolute!important;inset:0!important;
        width:100%!important;height:100%!important;
        z-index:99999!important;background:none;pointer-events:none!important
      }
      #game .ejs_virtualGamepad_parent>div,
      #game .ejs_virtualGamepad_left,
      #game .ejs_virtualGamepad_right,
      #game .ejs_virtualGamepad_bottom,
      #game .ejs_virtualGamepad_button,
      #game .ejs_dpad_main,
      #game .ejs_dpad_main *{
        pointer-events:auto!important;
        touch-action:none!important
      }
      body.video-stretch #game .ejs_canvas_parent,
      body.video-stretch #game canvas,body.video-stretch #game video{
        position:absolute!important;top:0!important;left:0!important;right:0!important;
        width:100dvw!important;height:var(--mga-l-game)!important;
        max-width:100dvw!important;max-height:var(--mga-l-game)!important;
        object-fit:fill!important;z-index:1
      }
      #game .ejs_canvas_parent,
      #game canvas,#game video{
        position:absolute!important;top:0!important;bottom:var(--mga-l-strip)!important;
        left:0!important;right:0!important;margin:auto!important;
        width:min(100dvw,calc(var(--mga-l-game) * 1.333333))!important;
        height:var(--mga-l-game)!important;
        max-width:100dvw!important;max-height:var(--mga-l-game)!important;
        object-fit:fill!important;z-index:1;transform:none!important
      }
      /* CRÉDITO/START centralizados na base com fundo semitransparente */
      #game .ejs_virtualGamepad_bottom{
        bottom:max(6px,env(safe-area-inset-bottom))!important;gap:12px;
        left:0!important;right:0!important;transform:none!important;justify-content:center;
        pointer-events:none!important;z-index:99999!important
      }
      #game .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button{
        pointer-events:auto!important;touch-action:none!important;
        min-width:88px;height:36px!important;line-height:36px!important;font-size:11px!important;
        background:rgba(4,10,20,.65)!important;backdrop-filter:blur(4px)
      }
      /* Direcional no canto esquerdo; botões no canto direito */
      #game .ejs_virtualGamepad_left{
        left:max(10px,env(safe-area-inset-left))!important;
        bottom:max(8px,env(safe-area-inset-bottom))!important;
        z-index:99999!important
      }
      #game .ejs_virtualGamepad_right{
        left:auto!important;right:max(10px,env(safe-area-inset-right))!important;
        bottom:max(8px,env(safe-area-inset-bottom))!important;
        z-index:99999!important
      }
    }
    @media (orientation:landscape) and (max-height:600px){
      #game .ejs_virtualGamepad_parent{
        /* Direcional e botões maiores na horizontal: ocupam as faixas
           laterais livres, sem cobrir a tela do jogo centralizada. */
        --mga-dpad:clamp(128px,34vh,180px);
        --mga-btn:clamp(54px,14.5vh,76px);
        --mga-gap:clamp(6px,1.6vh,12px);
        --mga-side:max(10px,env(safe-area-inset-left));
        --mga-floor:max(8px,env(safe-area-inset-bottom))
      }
      #difficulty-setup{padding:10px max(12px,env(safe-area-inset-left)) 10px}
      #difficulty-setup .difficulty-card{width:min(620px,100%);max-height:calc(100vh - 20px);overflow:auto;padding:8px 12px}
      #difficulty-setup .difficulty-card>div:first-child{margin-bottom:6px!important;font-size:10px!important}
      #difficulty-setup .difficulty-card>div:last-child{margin-top:4px!important;font-size:8px!important}
      #difficulty-setup h1{font-size:16px;margin-bottom:5px}
      #difficulty-setup p{margin-bottom:9px;font-size:10px;line-height:1.25}
      #difficulty-setup .difficulty-actions{gap:8px}
      #difficulty-setup button{min-width:145px;padding:6px 12px;font-size:11px}
      #difficulty-setup .config-section{margin-top:6px;padding-top:6px}
      #difficulty-setup .config-grid{gap:5px;font-size:10px}
      #difficulty-setup label{padding:5px}
      #difficulty-setup select{padding:5px;font-size:10px}
      #difficulty-setup .controls-note{font-size:9px;line-height:1.25}
    }
    @media (orientation:portrait) and (max-width:600px){
      #difficulty-setup{padding:16px max(12px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom))}
      #difficulty-setup .difficulty-card{max-height:calc(100vh - 32px);overflow:auto;padding:18px 16px}
      #difficulty-setup .difficulty-actions{gap:8px}
      #difficulty-setup button{min-width:0;flex:1;padding:12px 8px}
    }
    #loading-art{position:fixed;inset:0;z-index:99990;background:#030006 url('/assets/game-loading-art.png') center/cover no-repeat;transition:opacity .35s ease;}
    #loading-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.62));}
    #loading-art.hidden{opacity:0;pointer-events:none;}
    #mga-rotate-warning{position:fixed;inset:0;z-index:100020;display:none;place-items:center;background:rgba(3,0,8,.96);color:#00e5ff;text-align:center;padding:24px;box-sizing:border-box;font:bold 16px monospace;line-height:1.6;text-shadow:0 0 10px #00e5ff}
    #mga-rotate-warning.show{display:grid!important}
    @media (orientation:portrait), (max-aspect-ratio:3/4){
      #loading-art{background-image:url('/assets/game-loading-art-portrait.png');}
      #difficulty-setup{background-image:linear-gradient(rgba(3,0,6,.68),rgba(3,0,6,.82)),url('/assets/game-loading-art-portrait.png');}
    }
    @media (min-aspect-ratio:7/5) and (orientation:landscape){
      #loading-art{background-image:url('/assets/game-loading-art.png');}
      #difficulty-setup{background-image:linear-gradient(rgba(3,0,6,.68),rgba(3,0,6,.82)),url('/assets/game-loading-art.png');}
    }
    /* O wrapper externo já fornece o único botão FECHAR. Os controles internos
       ficam abaixo do cabeçalho externo para nunca ocuparem o mesmo espaço. */
    #player-controls{position:fixed;top:4px;right:60px;z-index:100003;display:flex;gap:8px}
    #btn-close{display:none!important}
    #btn-fullscreen{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:1px solid #00e5ff66;color:#00e5ff;font-size:20px;cursor:pointer;backdrop-filter:blur(4px);transition:opacity .2s;border-radius:4px;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
    #btn-close:hover,#btn-fullscreen:hover{background:rgba(0,0,0,.8);border-color:#00e5ff}
    #player-controls.hidden{opacity:0;pointer-events:none}
    @media (hover:none) and (pointer:coarse){
      #btn-close,#btn-fullscreen{width:36px;height:36px;padding:0;font-size:19px}
      #player-controls{top:max(8px,env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 50px);gap:8px}
      #difficulty-setup label:has([data-setting="scanlines"]),
      #difficulty-setup label:has([data-setting="vignette"]){display:none!important}
    }

    /* Em horizontal mobile, o cabeçalho externo pode ficar oculto pelo modo
       tela cheia. Mantenha o botão de salvar acessível dentro do player. */
    @media (hover:none) and (pointer:coarse) and (orientation:landscape){
      body.mga-embedded #btn-save{display:flex!important}
      body.mga-embedded #player-controls{gap:4px;right:max(8px,env(safe-area-inset-right))}
    }

    /* Dentro do launcher (iframe) o cabeçalho externo já tem Saves (1-15) e
       Fechar e fica por cima do canto superior direito. Então o botão Saves
       interno some (o externo abre o mesmo painel via postMessage) e os demais
       botões descem para logo abaixo do cabeçalho. Ajuste --mga-header-h (ou
       use ?headerH=NN na URL) se o cabeçalho tiver outra altura. */
    body.mga-embedded #btn-save{display:none!important}
    body.mga-embedded #player-controls{
      top:calc(max(8px,env(safe-area-inset-top)) + var(--mga-header-h));
      right:max(10px,env(safe-area-inset-right))
    }

    /* Em tela cheia horizontal o cabeçalho externo pode ficar fora da área
       visível ou ser ocultado pelo navegador. Nesse caso o botão interno é a
       alternativa de acesso aos mesmos 15 slots de save. Esta regra precisa
       ficar depois da regra geral de iframe para vencer o display:none. */
    @media (hover:none) and (pointer:coarse) and (orientation:landscape){
      body.mga-embedded #btn-save{display:flex!important}
      body.mga-embedded #player-controls{
        top:max(8px,env(safe-area-inset-top));
        right:max(8px,env(safe-area-inset-right));
        gap:4px
      }
    }

    :root{--mga-pad-opacity:0.75;--mga-header-h:52px;}
    html,body,#game{overscroll-behavior:none!important;-webkit-overscroll-behavior:none!important;-webkit-touch-callout:none}
    #game .ejs_virtualGamepad_parent{opacity:var(--mga-pad-opacity,0.75)!important;transition:opacity .2s ease}

    .mga-ctrl-btn{height:36px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(8,0,18,.8);border:1px solid #00e5ffaa;box-shadow:0 0 8px rgba(0,229,255,.3);color:#00e5ff;font:bold 11px monospace;cursor:pointer;backdrop-filter:blur(4px);transition:opacity .2s,background .2s;border-radius:4px;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
    .mga-ctrl-btn:hover{background:rgba(0,229,255,.25);border-color:#00e5ff}
    @media (hover:none) and (pointer:coarse){
      .mga-ctrl-btn{height:36px;padding:0 7px;font-size:11px}
    }

    #btn-save{height:36px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(8,0,18,.8);border:1px solid #00e5ffaa;box-shadow:0 0 8px rgba(0,229,255,.3);color:#00e5ff;font:bold 11px monospace;cursor:pointer;backdrop-filter:blur(4px);transition:opacity .2s,background .2s;border-radius:4px;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
    #btn-save:hover{background:rgba(0,229,255,.25);border-color:#00e5ff}
    @media (hover:none) and (pointer:coarse){
      #btn-save{height:36px;padding:0 8px;font-size:11px}
    }
    #mga-saves-modal{position:fixed;inset:0;z-index:100005;background:rgba(2,0,6,.88);backdrop-filter:blur(8px);display:none;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));box-sizing:border-box;font-family:monospace;color:#fff}
    #mga-saves-modal.open{display:grid!important}
    .mga-modal-dialog{width:min(660px,100%);max-height:min(90dvh,540px);background:#070012;border:2px solid #00e5ff;box-shadow:0 0 24px rgba(0,229,255,.35);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
    .mga-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#100022;border-bottom:1px solid #00e5ff44}
    .mga-modal-title{color:#00e5ff;font-size:13px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 8px #00e5ff88}
    .mga-modal-close{background:transparent;border:1px solid #ff2b6d;color:#ff6f9e;width:30px;height:30px;display:grid;place-items:center;font-size:18px;cursor:pointer;border-radius:4px;line-height:1}
    .mga-modal-actions{display:flex;gap:8px;padding:8px 14px;background:rgba(0,229,255,.05);border-bottom:1px solid #ffffff15;flex-wrap:wrap;align-items:center}
    .mga-btn-action{background:#120224;border:1px solid #00e5ff88;color:#00e5ff;padding:6px 12px;font:bold 11px monospace;cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;gap:6px;min-height:30px}
    .mga-btn-action:hover{background:#00e5ff22}
    .mga-btn-return{border-color:#39ff88;color:#39ff88}
    .mga-btn-return:hover{background:#39ff8822}
    .mga-slots-grid{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
    .mga-slot-card{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(0,229,255,.2);border-radius:6px;gap:8px}
    .mga-slot-card.has-data{border-color:rgba(57,255,136,.4);background:rgba(57,255,136,.04)}
    .mga-slot-left{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
    .mga-slot-badge{font-size:11px;font-weight:bold;color:#00e5ff}
    .mga-slot-card.has-data .mga-slot-badge{color:#39ff88}
    .mga-slot-time{font-size:10px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mga-slot-btns{display:flex;gap:6px;align-items:center;flex-shrink:0}
    .mga-btn-save{background:#062238;border:1px solid #00e5ff;color:#00e5ff;padding:5px 9px;font:bold 11px monospace;cursor:pointer;border-radius:4px;min-height:32px}

    .mga-btn-load:disabled{opacity:.3;border-color:#555;color:#777;cursor:not-allowed}
    .mga-btn-del{background:#380611;border:1px solid #ff2b6d;color:#ff6f9e;padding:5px 8px;font:bold 11px monospace;cursor:pointer;border-radius:4px;min-height:32px}
    .mga-btn-del:disabled{opacity:.2;border-color:#555;color:#777;cursor:not-allowed}
    #mga-toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:100010;background:rgba(8,0,18,.96);border:1px solid #00e5ff;box-shadow:0 0 16px rgba(0,229,255,.5);color:#00e5ff;padding:8px 16px;border-radius:20px;font:bold 12px monospace;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}
    #mga-toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

   </style>
