name: Build MAME 0.168 Web

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Compile MAME 0.168 arcade for Emscripten
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "GitHub Actions OK"
          uname -a
          python3 --version
          make --version | head -n 1
