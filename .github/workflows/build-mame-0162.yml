name: Build MAME 0.168 Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mame-0162.yml'
      - 'web/player.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile MAME 0.168 for Emscripten
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Clone exact MAME 0.168 source
        shell: bash
        run: |
          set -e
          rm -rf mame-0168
          git clone --depth 1 --branch mame0168 https://github.com/mamedev/mame.git mame-0168
          git -C mame-0168 rev-parse HEAD

      - name: Prepare MAME 0.168 build options
        shell: bash
        run: |
          cat > mame-0168/useroptions.mak <<'EOF'
          NOWERROR = 1
          NOASM = 1
          OPTIMIZE = 3
          OSD = sdl
          PTR64 = 0
          EOF

      - name: Build with exact historical Emscripten 1.35.10
        shell: bash
        run: |
          set -e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:2.7.18-buster \
            bash -lc '
              set -e

              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                "deb http://archive.debian.org/debian-security buster/updates main" \
                > /etc/apt/sources.list
              echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until

              apt-get update
              apt-get install -y --no-install-recommends \
                git make gcc g++ clang lld ca-certificates curl zip gzip python3

              python --version
              python3 --version

              rm -rf /root/emsdk
              git clone --depth 1 https://github.com/emscripten-core/emsdk.git /root/emsdk
              cd /root/emsdk
              git fetch --depth 1 origin e4acfff1951edb2662ff6e3310824418e7c5bb83
              git checkout e4acfff1951edb2662ff6e3310824418e7c5bb83

              echo "Emscripten histórico:"
              ./emsdk list --old | grep -E "1\.35\.10|sdk-1\.35\.10" || true

              echo "Instalando Emscripten 1.35.10..."
              ./emsdk install sdk-1.35.10-64bit
              ./emsdk activate sdk-1.35.10-64bit
              source /root/emsdk/emsdk_env.sh

              echo "Emscripten:"
              emcc --version
              emmake --version

              cd /workspace/mame-0168

              echo "Gerando makefiles MAME 0.168..."
              make REGENIE=1 gcc=asmjs gcc_version=4.9 \
                TARGET=mame SUBTARGET=mame OSD=sdl \
                PTR64=0 NOASM=1 NOWERROR=1 OPTIMIZE=3

              echo "Compilando MAME 0.168..."
              emmake make gcc=asmjs gcc_version=4.9 \
                TARGET=mame SUBTARGET=mame OSD=sdl \
                PTR64=0 NOASM=1 NOWERROR=1 OPTIMIZE=3 -j2
            '

      - name: Collect generated MAME Web files
        shell: bash
        run: |
          set -e
          rm -rf mame-0168-build
          mkdir -p mame-0168-build

          echo 'Arquivos JavaScript/WebAssembly encontrados:'
          find mame-0168 -type f \( \
            -name '*.js' -o \
            -name '*.wasm' -o \
            -name '*.mem' \
          \) -print

          find mame-0168 -type f \( \
            -name 'mame.js' -o \
            -name 'mame.wasm' -o \
            -name 'mame.mem' \
          \) -exec cp -v {} mame-0168-build/ \;

          printf 'MAME 0.168 Web build\n' > mame-0168-build/VERSION.txt
          git -C mame-0168 rev-parse HEAD >> mame-0168-build/VERSION.txt

          test -f mame-0168-build/mame.js

      - name: Upload MAME 0.168 Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mame-0168-web
          path: mame-0168-build/
          retention-days: 14

      - name: Publish generated MAME Web files into the web project
        shell: bash
        run: |
          set -e
          rm -rf web/mame0168
          mkdir -p web/mame0168
          cp -v mame-0168-build/* web/mame0168/
          printf 'MAME 0.168\n' > web/mame0168/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/mame0168
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no build Web."
            exit 0
          fi
          git commit -m "Publicar build Web do MAME 0.168"
          git push origin HEAD:main
