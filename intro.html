<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Games Arcade</title>
<style>
  @font-face { font-family:'Press Start 2P'; src:url('/fonts/press-start-2p-latin-400-normal.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'VT323'; src:url('/fonts/vt323-latin-400-normal.woff2') format('woff2'); font-display:swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; cursor: none; }
  .window-controls{position:fixed;top:8px;right:10px;z-index:250;display:flex;gap:8px;-webkit-app-region:no-drag}
  .win-btn{width:29px;height:18px;border:1px solid rgba(117,199,229,.52);border-radius:5px;background:rgba(2,8,18,.78);color:#c9f6ff;display:grid;place-items:center;padding:0;cursor:none;box-shadow:0 0 10px rgba(0,229,255,.16);transition:.12s}
  .win-btn svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .win-btn:hover{border-color:#00e5ff;color:#fff;background:rgba(0,229,255,.18);box-shadow:0 0 14px rgba(0,229,255,.38)}
  .win-btn.close:hover{border-color:#ff4f8b;background:rgba(255,47,101,.2);box-shadow:0 0 14px rgba(255,47,101,.42)}
  #bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 1.5s ease; }
  #bgVideo.visible { opacity: 1; }
  #bgImage { position: fixed; inset: 0; z-index: 1; background: url('/assets/background.png') center center / cover no-repeat; opacity: 0; transition: opacity 2.5s ease; }
  #bgImage.visible { opacity: 1; }
  #darkLayer { position: fixed; inset: 0; z-index: 2; background: rgba(0,0,10,0.65); transition: opacity 2.5s ease; }
  #darkLayer.light { opacity: 0.15; }
  .vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.88) 100%); }
  .scanlines { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px); }
  .scan-sweep { position: fixed; left: 0; right: 0; z-index: 5; height: 2px; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(0,229,255,0.5), transparent); animation: sweep 4s linear infinite; }
  @keyframes sweep { 0% { top:-2px; opacity:0; } 5% { opacity:1; } 95% { opacity:1; } 100% { top:100vh; opacity:0; } }
  .corner { position: fixed; z-index: 20; width: 44px; height: 44px; opacity: 0; transition: opacity 1s ease; }
  .corner.show { opacity: 1; }
  .corner-tl { top:16px; left:16px; } .corner-tr { top:16px; right:16px; transform:scaleX(-1); } .corner-bl { bottom:16px; left:16px; transform:scaleY(-1); } .corner-br { bottom:16px; right:16px; transform:scale(-1); }
  #introContent { position: fixed; left: 0; right: 0; bottom: 10vh; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0; transform: none; transition: opacity 2s ease; }
  #introContent.hidden { opacity: 0; pointer-events: none; }
  .deco-line { height: 1px; width: 0; margin: 0 auto; background: linear-gradient(90deg, transparent, #00e5ff, #e040fb, transparent); transition: width 1s ease; }
  .deco-line.expand { width: min(220px, 48vw); } .deco-line-bot { background: linear-gradient(90deg, transparent, #e040fb, #00e5ff, transparent); }
  .subtitle { font-family: 'Press Start 2P', monospace; font-size: clamp(5px, 0.65vw, 6px); color: #e040fb; letter-spacing: 2px; opacity: 0; margin: 6px 0 4px; text-shadow: 0 0 20px #e040fb; transition: opacity 0.8s ease; }
  .subtitle.show { opacity: 1; }
  .main-title { font-family: 'Press Start 2P', monospace; font-size: clamp(11px, 1.5vw, 16px); line-height: 1.2; text-align: center; opacity: 0; transform: scale(0.5) translateY(12px); transform-origin: center center; transition: opacity 0.9s ease, transform 0.9s ease; }
  .main-title.show { opacity: 1; transform: scale(0.36) translateY(0); }
  .w1 { display:block; color:#fff; text-shadow:0 0 30px rgba(255,255,255,0.3); } .w2 { display:block; color:#00e5ff; text-shadow:0 0 40px #00e5ff, 0 0 80px rgba(0,229,255,0.3); } .w3 { display:block; color:#e040fb; text-shadow:0 0 40px #e040fb, 0 0 80px rgba(224,64,251,0.3); }
  .version-row { display:flex; align-items:center; gap:12px; margin-top:14px; opacity:0; transition:opacity 0.8s ease; } .version-row.show { opacity:1; }
  .vdot { width:7px; height:7px; border-radius:50%; background:#00e676; box-shadow:0 0 8px #00e676; animation:pulse 1.4s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }
  .vtext { font-family:'VT323',monospace; color:#b7dce8; font-size:18px; letter-spacing:2px; }
  #insertCoin { position:fixed; z-index:30; left:0; right:0; bottom:7vh; text-align:center; opacity:0; transform:translateY(10px); transition:opacity .8s ease, transform .8s ease; pointer-events:none; }
  #insertCoin.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #insertCoin .coin-text { font-family:'Press Start 2P',monospace; color:#fff; font-size:clamp(8px,1vw,12px); letter-spacing:3px; text-shadow:0 0 12px #00e5ff,0 0 24px #00e5ff; animation:coinPulse 1.3s ease-in-out infinite; }
  @keyframes coinPulse { 0%,100%{opacity:.65}50%{opacity:1} }
  #insertCoin .hint { margin-top:12px; font-family:'VT323',monospace; font-size:20px; color:#8faab5; letter-spacing:2px; }
  .particle { position:fixed; z-index:7; border-radius:50%; opacity:0; animation:floatUp linear infinite; }
  @keyframes floatUp { 0%{transform:translateY(20vh) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.5}100%{transform:translateY(-110vh) translateX(var(--drift));opacity:0} }
  #cursor { position:fixed; z-index:200; width:10px;height:10px;border:1px solid #00e5ff;border-radius:50%;box-shadow:0 0 8px #00e5ff;pointer-events:none;transform:translate(-50%,-50%); }
  #exitOverlay { position:fixed;inset:0;z-index:100;pointer-events:none;background:#000;opacity:0;transition:opacity .7s ease; } #exitOverlay.active{opacity:1;}
</style>
</head>
<body>
<video id="bgVideo" playsinline preload="auto"><source src="/intro_bg.mp4" type="video/mp4"></video>
<div id="bgImage"></div><div id="darkLayer"></div><div class="vignette"></div><div class="scanlines"></div><div class="scan-sweep"></div>
<div class="corner corner-tl" id="c1"></div><div class="corner corner-tr" id="c2"></div><div class="corner corner-bl" id="c3"></div><div class="corner corner-br" id="c4"></div>
<div id="introContent"><div class="deco-line" id="lineTop"></div><div class="subtitle" id="subtitle">THE ULTIMATE ARCADE EXPERIENCE</div><div class="main-title" id="mainTitle"><span class="w1">MASTER</span><span class="w2">GAMES</span><span class="w3">ARCADE</span></div><div class="version-row" id="vrow"><span class="vdot"></span><span class="vtext">WEB EDITION • 2026</span></div><div class="deco-line deco-line-bot" id="lineBot"></div></div>
<div id="insertCoin"><div class="coin-text">INSERT COIN</div><div class="hint">PRESSIONE QUALQUER TECLA PARA CONTINUAR</div></div><div id="cursor"></div><div id="exitOverlay"></div>
<script>
const AudioContextClass=window.AudioContext||window.webkitAudioContext; const ctx=AudioContextClass?new AudioContextClass():null;
function playAmbientHum(){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=55;g.gain.value=.025;o.connect(g);g.connect(ctx.destination);o.start();}
function playPowerOn(){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(90,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(900,ctx.currentTime+.5);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.7);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.75);}
function playLogoReveal(){if(!ctx)return;[523,659,784,1046].forEach((f,i)=>{setTimeout(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.11,ctx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.42);o.start();o.stop(ctx.currentTime+.45);},i*280);});}
function playImageReveal(){if(!ctx)return;const t=ctx.currentTime,buf=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buf;filter.type='bandpass';filter.frequency.setValueAtTime(200,t);filter.frequency.exponentialRampToValueAtTime(4000,t+1);filter.Q.value=.5;src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(.25,t);gain.gain.linearRampToValueAtTime(0,t+1.5);src.start(t);src.stop(t+1.5);}
function playCoinSound(){if(!ctx)return;const t=ctx.currentTime;[880,1175,1568].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const st=t+i*.085;g.gain.setValueAtTime(.001,st);g.gain.exponentialRampToValueAtTime(.14,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.34);o.start(st);o.stop(st+.38);});}
function playStartSound(){if(!ctx)return;const t=ctx.currentTime;[392,523,659,784,1046].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.value=f;const st=t+i*.07;g.gain.setValueAtTime(.15,st);g.gain.exponentialRampToValueAtTime(.001,st+.35);o.start(st);o.stop(st+.4);});}
let canEnter=false;
function startIntro(){playAmbientHum();setTimeout(playPowerOn,300);document.getElementById('bgVideo').classList.add('visible');setTimeout(()=>['c1','c2','c3','c4'].forEach(id=>document.getElementById(id).classList.add('show')),800);setTimeout(()=>{document.getElementById('lineTop').classList.add('expand');document.getElementById('lineBot').classList.add('expand')},1400);setTimeout(()=>document.getElementById('subtitle').classList.add('show'),1900);setTimeout(()=>{document.getElementById('mainTitle').classList.add('show');playLogoReveal()},2400);setTimeout(()=>document.getElementById('vrow').classList.add('show'),3200);}
document.getElementById('bgVideo').addEventListener('ended',transitionToImage);document.getElementById('bgVideo').addEventListener('error',()=>setTimeout(transitionToImage,5000));
function transitionToImage(){playImageReveal();document.getElementById('introContent').classList.add('hidden');document.getElementById('bgVideo').style.transition='opacity 2s ease';document.getElementById('bgVideo').style.opacity='0';setTimeout(()=>{document.getElementById('bgImage').classList.add('visible');document.getElementById('darkLayer').classList.add('light')},500);setTimeout(()=>{document.getElementById('insertCoin').classList.add('show');playCoinSound();canEnter=true},2500);}
function enterLauncher(){if(!canEnter)return;canEnter=false;playStartSound();setTimeout(()=>{document.getElementById('exitOverlay').classList.add('active');setTimeout(()=>{try{sessionStorage.setItem('mga.introSeen','1')}catch(e){}window.location.href='/?launcher=1'},700)},400);}
document.addEventListener('keydown',()=>{if(canEnter)enterLauncher()});
(function padIntro(){const list=()=>{try{return[...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)}catch{return[]}};const poll=()=>{for(const g of list()){if((g.buttons||[]).some(b=>b&&(b.pressed||b.value>.5))){if(canEnter)enterLauncher();break}}requestAnimationFrame(poll)};requestAnimationFrame(poll)})();
document.addEventListener('mousemove',e=>{const c=document.getElementById('cursor');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';});
function createParticles(){const colors=['#00e5ff','#e040fb','#ffea00','#00e676'];for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';const c=colors[Math.floor(Math.random()*colors.length)],sz=1.5+Math.random()*2;p.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;background:${c};box-shadow:0 0 4px ${c};animation-duration:${7+Math.random()*10}s;animation-delay:${Math.random()*8}s;--drift:${(Math.random()-.5)*120}px;`;document.body.appendChild(p)}}createParticles();
let started=false;function init(){if(started)return;started=true;const v=document.getElementById('bgVideo');try{v.muted=false;v.volume=.8;v.currentTime=0;v.play().catch(()=>{});}catch(e){}try{if(ctx)ctx.resume()}catch(e){}startIntro()}init();
</script>
</body>
</html>
